---
# yaml-language-server: $schema=https://raw.githubusercontent.com/oxsecurity/megalinter/v10.0.0/megalinter/descriptors/schemas/megalinter-configuration.jsonschema.json

# Empathy's active monorepo profile.
#
# Egolint owns the complete cross-language policy, configuration catalog, and
# holistic profile. This root bridge selects the deterministic subset that is
# appropriate for every pull request while preserving the full suite at
# `task lint:holistic`.
EXTENDS:
  - egolint/.mega-linter.yml

ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - BASH_EXEC
  - BASH_SHELLCHECK
  - BASH_SHFMT
  - EDITORCONFIG_EDITORCONFIG_CHECKER
  - JSON_JSONLINT
  - JSON_PRETTIER
  - MARKDOWN_MARKDOWNLINT
  - PYTHON_RUFF
  - REPOSITORY_GITLEAKS
  - YAML_PRETTIER
  - YAML_YAMLLINT

REPORT_OUTPUT_FOLDER: .reports/megalinter

# Pull-request feedback is owned by the workflow summary and uploaded artifacts
# so the routine profile can retain read-only repository permissions.
GITHUB_COMMENT_REPORTER: false
GITHUB_STATUS_REPORTER: false
FILEIO_REPORTER: false
