---
# yaml-language-server: $schema=https://raw.githubusercontent.com/oxsecurity/megalinter/v10.0.0/megalinter/descriptors/schemas/megalinter-configuration.jsonschema.json

# Empathy's canonical MegaLinter entry point.
#
# The default is intentionally holistic: local `task lint`, trusted main-branch
# runs, and manual audits inspect every supported and baselined descriptor. The
# explicit changed-file profile lives at `egolint/.mega-linter.fast.yml` and is
# selected by `task lint:fast` and pull-request CI.
EXTENDS:
  - egolint/.mega-linter.yml

REPORT_OUTPUT_FOLDER: .reports/megalinter

# Repository runs publish through workflow summaries and artifacts. Direct
# MegaLinter comments/statuses require broader permissions and remain disabled.
GITHUB_COMMENT_REPORTER: false
GITHUB_STATUS_REPORTER: false
FILEIO_REPORTER: false
