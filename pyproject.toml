[project]
name = "empathy"
version = "0.1.0"
description = "A humane, reusable repository foundation for people, automation, and AI agents."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "MIT"
authors = [
  { name = "Alan Szmyt", email = "14865041+szmyty@users.noreply.github.com" },
]
maintainers = [
  { name = "Alan Szmyt", email = "14865041+szmyty@users.noreply.github.com" },
]
keywords = [
  "automation",
  "developer-experience",
  "github-actions",
  "repository-template",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/egohygiene/empathy"
Issues = "https://github.com/egohygiene/empathy/issues"
Repository = "https://github.com/egohygiene/empathy"

[tool.poetry]
requires-poetry = ">=2.4,<3.0"
package-mode = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "UP",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tests"]
