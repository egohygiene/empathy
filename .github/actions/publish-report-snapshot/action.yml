---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: Publish report snapshot
description: >-
  Guard, stage, commit, and push stable generated report snapshots from a
  trusted default-branch workflow job.

inputs:
  paths:
    description: One .reports/-relative Git pathspec per line.
    required: true
  commit-message:
    description: Commit message used when the curated snapshot changed.
    required: true
  default-branch:
    description: Repository default branch that trusted publication may update.
    required: true
  author-name:
    description: Git author and committer name.
    required: false
    default: "github-actions[bot]"
  author-email:
    description: Git author and committer email.
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"

outputs:
  changed:
    description: Whether the action created and pushed a report commit.
    value: "${{ steps.publish.outputs.changed }}"
  commit-sha:
    description: Created commit SHA, or an empty string when nothing changed.
    value: "${{ steps.publish.outputs.commit-sha }}"

runs:
  using: composite
  steps:
    - name: Publish curated report snapshot
      id: publish
      shell: bash
      env:
        INPUT_AUTHOR_EMAIL: "${{ inputs.author-email }}"
        INPUT_AUTHOR_NAME: "${{ inputs.author-name }}"
        INPUT_COMMIT_MESSAGE: "${{ inputs.commit-message }}"
        INPUT_DEFAULT_BRANCH: "${{ inputs.default-branch }}"
        INPUT_PATHS: "${{ inputs.paths }}"
      run: |
        set -euo pipefail

        # @description Reject untrusted events and non-default branches.
        validate_trust_boundary() {
          case "${GITHUB_EVENT_NAME}" in
            pull_request | pull_request_target)
              printf 'Report publication is forbidden for %s events.\n' \
                "${GITHUB_EVENT_NAME}" >&2
              return 2
              ;;
            *) ;;
          esac

          if [[ "${GITHUB_REF_NAME}" != "${INPUT_DEFAULT_BRANCH}" ]]; then
            printf 'Report publication requires the default branch %s; received %s.\n' \
              "${INPUT_DEFAULT_BRANCH}" "${GITHUB_REF_NAME}" >&2
            return 2
          fi
        }

        # @description Parse report-only pathspecs into REPORT_PATHS.
        # @set REPORT_PATHS Validated report paths in caller scope.
        parse_report_paths() {
          REPORT_PATHS=()
          while IFS= read -r report_path; do
            [[ -n "${report_path}" ]] || continue
            case "${report_path}" in
              .reports/*) ;;
              *)
                printf 'Report path must remain under .reports/: %s\n' \
                  "${report_path}" >&2
                return 2
                ;;
            esac
            if [[ "${report_path}" == *".."* || "${report_path}" == *"/history"* ]]; then
              printf 'Report path must be stable and traversal-free: %s\n' \
                "${report_path}" >&2
              return 2
            fi
            if [[ ! -e "${report_path}" ]]; then
              printf 'Report snapshot does not exist: %s\n' "${report_path}" >&2
              return 2
            fi
            if find "${report_path}" -type d -name history -print -quit | grep --quiet .; then
              printf 'Timestamped history directories are forbidden: %s\n' \
                "${report_path}" >&2
              return 2
            fi
            REPORT_PATHS+=("${report_path}")
          done <<< "${INPUT_PATHS}"

          if ((${#REPORT_PATHS[@]} == 0)); then
            printf 'paths must contain at least one report path.\n' >&2
            return 2
          fi
        }

        validate_trust_boundary
        parse_report_paths

        git rev-parse --is-inside-work-tree > /dev/null
        git config user.name "${INPUT_AUTHOR_NAME}"
        git config user.email "${INPUT_AUTHOR_EMAIL}"
        git add --force --all -- "${REPORT_PATHS[@]}"

        if git diff --cached --quiet; then
          printf 'No curated report changes to publish.\n'
          printf 'changed=false\n' >> "${GITHUB_OUTPUT}"
          printf 'commit-sha=\n' >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        git commit --message "${INPUT_COMMIT_MESSAGE}"

        for attempt in 1 2 3; do
          git pull --rebase origin "${INPUT_DEFAULT_BRANCH}"
          if git push origin "HEAD:${INPUT_DEFAULT_BRANCH}"; then
            break
          fi
          if ((attempt == 3)); then
            printf 'Unable to publish after %s attempts.\n' "${attempt}" >&2
            exit 1
          fi
          printf 'Report push raced with another writer; retrying (%s/3).\n' \
            "${attempt}" >&2
          sleep "$((attempt * 2))"
        done

        commit_sha="$(git rev-parse HEAD)"

        printf 'changed=true\n' >> "${GITHUB_OUTPUT}"
        printf 'commit-sha=%s\n' "${commit_sha}" >> "${GITHUB_OUTPUT}"
