---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: Set up Python and Poetry
description: >-
  Install pinned Python and Poetry versions, restore a project-local virtual
  environment, and optionally install dependencies from poetry.lock.

inputs:
  python-version:
    description: Python version understood by actions/setup-python.
    required: false
    default: "3.12"
  poetry-version:
    description: Exact Poetry version installed with pipx.
    required: false
    default: "2.4.1"
  working-directory:
    description: Poetry project directory, relative to the workspace.
    required: false
    default: "."
  cache:
    description: Cache the repository-local virtual environment.
    required: false
    default: "true"
  cache-dependency-path:
    description: Lockfile used to derive the virtual-environment cache key.
    required: false
    default: "poetry.lock"
  install-dependencies:
    description: Run poetry install after restoring the cache.
    required: false
    default: "true"
  require-lockfile:
    description: Fail dependency installation when poetry.lock is absent.
    required: false
    default: "true"
  install-arguments:
    description: Whitespace-separated arguments appended to poetry install.
    required: false
    default: "--no-interaction --no-root"

outputs:
  python-version:
    description: Installed Python version.
    value: "${{ steps.versions.outputs.python-version }}"
  poetry-version:
    description: Installed Poetry version.
    value: "${{ steps.versions.outputs.poetry-version }}"
  virtualenv-path:
    description: Absolute path to the project virtual environment.
    value: "${{ steps.versions.outputs.virtualenv-path }}"

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        INPUT_CACHE: "${{ inputs.cache }}"
        INPUT_INSTALL_DEPENDENCIES: "${{ inputs.install-dependencies }}"
        INPUT_POETRY_VERSION: "${{ inputs.poetry-version }}"
        INPUT_REQUIRE_LOCKFILE: "${{ inputs.require-lockfile }}"
      run: |
        set -euo pipefail
        for value in \
          "${INPUT_CACHE}" \
          "${INPUT_INSTALL_DEPENDENCIES}" \
          "${INPUT_REQUIRE_LOCKFILE}"; do
          case "${value}" in
            true|false) ;;
            *)
              printf 'Boolean inputs must be true or false: %s\n' "${value}" >&2
              exit 2
              ;;
          esac
        done
        [[ "${INPUT_POETRY_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          printf 'poetry-version must be an exact semantic version: %s\n' \
            "${INPUT_POETRY_VERSION}" >&2
          exit 2
        }

    - name: Set up Python
      # actions/setup-python v6.3.0
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: "${{ inputs.python-version }}"

    - name: Install Poetry
      shell: bash
      env:
        POETRY_VERSION: "${{ inputs.poetry-version }}"
      run: |
        set -euo pipefail
        command -v pipx >/dev/null || {
          printf 'pipx is required to install Poetry.\n' >&2
          exit 127
        }
        pipx install --force "poetry==${POETRY_VERSION}"

    - name: Restore Poetry virtual environment
      if: inputs.cache == 'true'
      # actions/cache v5.1.0
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: "${{ inputs.working-directory }}/.venv"
        key: >-
          ${{ runner.os }}-python-${{ inputs.python-version }}-poetry-${{
          hashFiles(inputs.cache-dependency-path) }}
        restore-keys: |
          ${{ runner.os }}-python-${{ inputs.python-version }}-poetry-

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      working-directory: "${{ inputs.working-directory }}"
      env:
        INPUT_INSTALL_ARGUMENTS: "${{ inputs.install-arguments }}"
        INPUT_REQUIRE_LOCKFILE: "${{ inputs.require-lockfile }}"
        POETRY_VIRTUALENVS_IN_PROJECT: "true"
      run: |
        set -euo pipefail
        [[ -f pyproject.toml ]] || {
          printf 'pyproject.toml was not found in %s.\n' "${PWD}" >&2
          exit 2
        }
        if [[ "${INPUT_REQUIRE_LOCKFILE}" == "true" && ! -f poetry.lock ]]; then
          printf 'poetry.lock is required for reproducible installation.\n' >&2
          exit 2
        fi

        install_arguments=()
        if [[ -n "${INPUT_INSTALL_ARGUMENTS}" ]]; then
          read -r -a install_arguments <<< "${INPUT_INSTALL_ARGUMENTS}"
        fi
        poetry install "${install_arguments[@]}"

    - name: Capture tool versions
      id: versions
      shell: bash
      working-directory: "${{ inputs.working-directory }}"
      env:
        POETRY_VIRTUALENVS_IN_PROJECT: "true"
      run: |
        set -euo pipefail
        printf 'python-version=%s\n' "$(python --version | awk '{print $2}')" \
          >> "${GITHUB_OUTPUT}"
        printf 'poetry-version=%s\n' "$(poetry --version | awk '{gsub(/[()]/, "", $3); print $3}')" \
          >> "${GITHUB_OUTPUT}"
        if [[ -f pyproject.toml ]]; then
          virtualenv_path="$(poetry env info --path 2>/dev/null || true)"
        else
          virtualenv_path=""
        fi
        printf 'virtualenv-path=%s\n' "${virtualenv_path}" >> "${GITHUB_OUTPUT}"
