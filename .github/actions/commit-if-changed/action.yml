---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: Commit if changed
description: >-
  Stage an explicit set of repository-relative paths, create one commit when
  the index changes, and optionally push the current HEAD to a target branch.

inputs:
  paths:
    description: One repository-relative Git pathspec per line.
    required: true
  commit-message:
    description: Commit message used when staged changes exist.
    required: true
  author-name:
    description: Git author and committer name.
    required: false
    default: "github-actions[bot]"
  author-email:
    description: Git author and committer email.
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"
  repository-directory:
    description: Repository directory, relative to the GitHub workspace.
    required: false
    default: "."
  target-branch:
    description: Branch to update. Defaults to the current event branch.
    required: false
    default: ""
  push:
    description: Push the new commit to origin.
    required: false
    default: "true"

outputs:
  changed:
    description: Whether the action created a commit.
    value: "${{ steps.commit.outputs.changed }}"
  commit-sha:
    description: Created commit SHA, or an empty string when nothing changed.
    value: "${{ steps.commit.outputs.commit-sha }}"

runs:
  using: composite
  steps:
    - name: Commit staged changes
      id: commit
      shell: bash
      working-directory: "${{ inputs.repository-directory }}"
      env:
        INPUT_AUTHOR_EMAIL: "${{ inputs.author-email }}"
        INPUT_AUTHOR_NAME: "${{ inputs.author-name }}"
        INPUT_COMMIT_MESSAGE: "${{ inputs.commit-message }}"
        INPUT_PATHS: "${{ inputs.paths }}"
        INPUT_PUSH: "${{ inputs.push }}"
        INPUT_TARGET_BRANCH: "${{ inputs.target-branch }}"
      run: |
        set -euo pipefail

        case "${INPUT_PUSH}" in
          true|false) ;;
          *)
            printf 'push must be true or false: %s\n' "${INPUT_PUSH}" >&2
            exit 2
            ;;
        esac

        git rev-parse --is-inside-work-tree >/dev/null
        git config user.name "${INPUT_AUTHOR_NAME}"
        git config user.email "${INPUT_AUTHOR_EMAIL}"

        pathspecs=()
        while IFS= read -r pathspec; do
          [[ -n "${pathspec}" ]] || continue
          pathspecs+=("${pathspec}")
        done <<< "${INPUT_PATHS}"

        if (( ${#pathspecs[@]} == 0 )); then
          printf 'paths must contain at least one non-empty pathspec.\n' >&2
          exit 2
        fi

        git add -- "${pathspecs[@]}"

        if git diff --cached --quiet; then
          printf 'No staged changes to commit.\n'
          printf 'changed=false\n' >> "${GITHUB_OUTPUT}"
          printf 'commit-sha=\n' >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        git commit --message "${INPUT_COMMIT_MESSAGE}"
        commit_sha="$(git rev-parse HEAD)"

        if [[ "${INPUT_PUSH}" == "true" ]]; then
          target_branch="${INPUT_TARGET_BRANCH:-${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}}"
          if [[ -z "${target_branch}" ]]; then
            printf 'Unable to determine a target branch; set target-branch explicitly.\n' >&2
            exit 2
          fi
          git push origin "HEAD:${target_branch}"
        fi

        printf 'changed=true\n' >> "${GITHUB_OUTPUT}"
        printf 'commit-sha=%s\n' "${commit_sha}" >> "${GITHUB_OUTPUT}"
