---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: Generate Flutter sources
description: >-
  Run optional localization generation, build_runner generation, and Dart
  formatting for a repository-relative Flutter project.

inputs:
  working-directory:
    description: Flutter project directory, relative to the workspace.
    required: false
    default: "."
  generate-localizations:
    description: Run dart run slang.
    required: false
    default: "false"
  generate-build-runner:
    description: Run build_runner with conflicting-output deletion enabled.
    required: false
    default: "true"
  format:
    description: Format the project after generation.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        INPUT_FORMAT: "${{ inputs.format }}"
        INPUT_GENERATE_BUILD_RUNNER: "${{ inputs.generate-build-runner }}"
        INPUT_GENERATE_LOCALIZATIONS: "${{ inputs.generate-localizations }}"
      run: |
        set -euo pipefail
        for value in \
          "${INPUT_GENERATE_LOCALIZATIONS}" \
          "${INPUT_GENERATE_BUILD_RUNNER}" \
          "${INPUT_FORMAT}"; do
          case "${value}" in
            true|false) ;;
            *)
              printf 'Boolean inputs must be true or false: %s\n' "${value}" >&2
              exit 2
              ;;
          esac
        done

    - name: Generate localizations
      if: inputs.generate-localizations == 'true'
      shell: bash
      working-directory: "${{ inputs.working-directory }}"
      run: dart run slang

    - name: Generate build_runner sources
      if: inputs.generate-build-runner == 'true'
      shell: bash
      working-directory: "${{ inputs.working-directory }}"
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Format generated Dart sources
      if: inputs.format == 'true'
      shell: bash
      working-directory: "${{ inputs.working-directory }}"
      run: dart format .
