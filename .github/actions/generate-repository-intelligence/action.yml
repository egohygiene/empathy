---
# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
name: "🧠 Generate Repository Intelligence"

description: >-
  Generate deterministic repository structure, Git activity, public-safe
  analytics, and SVG visualization artifacts under a repository-relative
  output directory.

inputs:
  output-root:
    description: "Repository-relative output directory for all generated artifacts."
    required: false
    default: "docs/generated"
  max-depth:
    description: "Maximum directory depth rendered by tree and visualization outputs."
    required: false
    default: "10"
  excluded-paths:
    description: "Comma-separated repository-relative paths or directory names to exclude."
    required: false
    default: ".git,.staging,.cache,.venv,docs/generated,node_modules,vendor,dist,build,coverage,__pycache__,site"
  analytics-excluded-paths:
    description: >-
      Comma-separated generated, cached, or vendored paths excluded from
      public analytics while remaining eligible for the repository tree.
    required: false
    default: ".git,.staging,.cache,.venv,.tox,.mypy_cache,.ruff_cache,.reports,docs/generated,node_modules,vendor,dist,build,coverage,__pycache__,site,target"
  activity-since:
    description: >-
      Activity window as an ISO-8601 date/timestamp or a deterministic relative
      value such as '1 year ago', anchored to the inspected commit.
    required: false
    default: "1 year ago"
  activity-ref:
    description: "Branch, tag, or revision inspected by the activity report."
    required: false
    default: "HEAD"
  activity-author:
    description: "Optional Git author pattern used to filter activity."
    required: false
    default: ""
  require-full-history:
    description: "Fail instead of producing incomplete activity data from a shallow clone."
    required: false
    default: "true"
  activity-gource:
    description: "Generate an optional Gource PNG. Dependencies must already be installed."
    required: false
    default: "false"
  activity-gitinspector:
    description: "Generate an optional GitInspector HTML report. GitInspector must be installed."
    required: false
    default: "false"

outputs:
  output-root:
    description: "Repository-relative root containing all generated artifacts."
    value: "${{ inputs.output-root }}"
  activity-summary:
    description: "Repository-relative path to the activity summary."
    value: "${{ inputs.output-root }}/activity/summary.md"
  repository-tree:
    description: "Repository-relative path to the Markdown repository tree."
    value: "${{ inputs.output-root }}/tree/repo.md"
  repository-tree-json:
    description: "Repository-relative path to the public-safe, commit-scoped tree contract."
    value: "${{ inputs.output-root }}/tree/repo.json"
  analytics-summary:
    description: "Repository-relative path to the public-safe analytics contract."
    value: "${{ inputs.output-root }}/analytics/summary.json"
  repository-visualization:
    description: "Repository-relative path to the generated SVG."
    value: "${{ inputs.output-root }}/visualization/repository.svg"

runs:
  using: "composite"

  steps:
    - name: "🔎 Validate inputs"
      shell: bash
      env:
        OUTPUT_ROOT: "${{ inputs.output-root }}"
        MAX_DEPTH: "${{ inputs.max-depth }}"
        REQUIRE_FULL_HISTORY: "${{ inputs.require-full-history }}"
        ACTIVITY_GOURCE: "${{ inputs.activity-gource }}"
        ACTIVITY_GITINSPECTOR: "${{ inputs.activity-gitinspector }}"
      run: |
        set -euo pipefail

        if [[ -z "${OUTPUT_ROOT}" || "${OUTPUT_ROOT}" == /* || "/${OUTPUT_ROOT}/" == */../* ]]; then
          printf 'output-root must be a non-empty repository-relative path without .. components: %s\n' "${OUTPUT_ROOT}" >&2
          exit 2
        fi

        if [[ ! "${MAX_DEPTH}" =~ ^[0-9]+$ ]] || (( MAX_DEPTH < 1 )); then
          printf 'max-depth must be a positive integer: %s\n' "${MAX_DEPTH}" >&2
          exit 2
        fi

        for value_name in REQUIRE_FULL_HISTORY ACTIVITY_GOURCE ACTIVITY_GITINSPECTOR; do
          value="${!value_name}"
          if [[ "${value}" != "true" && "${value}" != "false" ]]; then
            printf '%s must be true or false: %s\n' "${value_name}" "${value}" >&2
            exit 2
          fi
        done

        mkdir -p "${GITHUB_WORKSPACE}/${OUTPUT_ROOT}/tree"
        mkdir -p "${GITHUB_WORKSPACE}/${OUTPUT_ROOT}/activity"
        mkdir -p "${GITHUB_WORKSPACE}/${OUTPUT_ROOT}/analytics"
        mkdir -p "${GITHUB_WORKSPACE}/${OUTPUT_ROOT}/visualization"

    - name: "🌳 Generate repository tree"
      shell: bash
      env:
        OUTPUT_ROOT: "${{ inputs.output-root }}"
        MAX_DEPTH: "${{ inputs.max-depth }}"
        EXCLUDED_PATHS: "${{ inputs.excluded-paths }}"
        ACTIVITY_REF: "${{ inputs.activity-ref }}"
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/generate_repository_intelligence.py" \
          --repo-root "${GITHUB_WORKSPACE}" \
          --output-root "${GITHUB_WORKSPACE}/${OUTPUT_ROOT}" \
          --ref "${ACTIVITY_REF}" \
          --max-depth "${MAX_DEPTH}" \
          --excluded-paths "${EXCLUDED_PATHS},${OUTPUT_ROOT}"

    - name: "📊 Generate repository activity"
      shell: bash
      env:
        OUTPUT_ROOT: "${{ inputs.output-root }}"
        ACTIVITY_SINCE: "${{ inputs.activity-since }}"
        ACTIVITY_REF: "${{ inputs.activity-ref }}"
        ACTIVITY_AUTHOR: "${{ inputs.activity-author }}"
        REQUIRE_FULL_HISTORY: "${{ inputs.require-full-history }}"
        ACTIVITY_GOURCE: "${{ inputs.activity-gource }}"
        ACTIVITY_GITINSPECTOR: "${{ inputs.activity-gitinspector }}"
      run: |
        set -euo pipefail

        args=(
          --repo "${GITHUB_WORKSPACE}"
          --output "${OUTPUT_ROOT}/activity"
          --since "${ACTIVITY_SINCE}"
          --ref "${ACTIVITY_REF}"
          --color never
        )

        if [[ -n "${ACTIVITY_AUTHOR}" ]]; then
          args+=(--author "${ACTIVITY_AUTHOR}")
        fi
        if [[ "${REQUIRE_FULL_HISTORY}" == "true" ]]; then
          args+=(--require-full-history)
        fi
        if [[ "${ACTIVITY_GOURCE}" == "true" ]]; then
          args+=(--gource)
        fi
        if [[ "${ACTIVITY_GITINSPECTOR}" == "true" ]]; then
          args+=(--gitinspector)
        fi

        bash "${GITHUB_ACTION_PATH}/repo-activity" "${args[@]}"

    - name: "🪩 Generate public repository analytics"
      shell: bash
      env:
        OUTPUT_ROOT: "${{ inputs.output-root }}"
        ACTIVITY_SINCE: "${{ inputs.activity-since }}"
        ACTIVITY_REF: "${{ inputs.activity-ref }}"
        ANALYTICS_EXCLUDED_PATHS: "${{ inputs.analytics-excluded-paths }}"
      run: |
        set -euo pipefail

        python3 "${GITHUB_ACTION_PATH}/generate_repository_analytics.py" \
          --repo-root "${GITHUB_WORKSPACE}" \
          --output "${GITHUB_WORKSPACE}/${OUTPUT_ROOT}/analytics/summary.json" \
          --ref "${ACTIVITY_REF}" \
          --since "${ACTIVITY_SINCE}" \
          --excluded-paths "${ANALYTICS_EXCLUDED_PATHS},${OUTPUT_ROOT}"
