---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: Validate GitHub automation
description: >-
  Run actionlint, validate local action metadata, and enforce Empathy's
  immutable-reference and least-privilege automation policy.

inputs:
  actionlint-version:
    description: Exact actionlint release version.
    required: false
    default: "1.7.12"
  actionlint-linux-amd64-sha256:
    description: SHA-256 checksum for the pinned actionlint Linux archive.
    required: false
    default: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  action-validator-version:
    description: Exact @action-validator/cli version.
    required: false
    default: "0.6.0"

runs:
  using: composite
  steps:
    - name: Install actionlint
      shell: bash
      env:
        ACTIONLINT_SHA256: "${{ inputs.actionlint-linux-amd64-sha256 }}"
        ACTIONLINT_VERSION: "${{ inputs.actionlint-version }}"
      run: |
        set -euo pipefail
        [[ "${RUNNER_OS}" == "Linux" && "${RUNNER_ARCH}" == "X64" ]] || {
          printf 'validate-automation currently requires a Linux X64 runner.\n' >&2
          exit 2
        }
        [[ "${ACTIONLINT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          printf 'actionlint-version must be exact: %s\n' "${ACTIONLINT_VERSION}" >&2
          exit 2
        }
        [[ "${ACTIONLINT_SHA256}" =~ ^[0-9a-f]{64}$ ]] || {
          printf 'Invalid actionlint SHA-256 checksum.\n' >&2
          exit 2
        }

        archive_name="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        install_root="${RUNNER_TEMP}/empathy-actionlint-${ACTIONLINT_VERSION}"
        archive_path="${install_root}/${archive_name}"
        mkdir -p "${install_root}"

        curl --fail --location --silent --show-error \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive_name}" \
          --output "${archive_path}"
        printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive_path}" | sha256sum --check
        tar --extract --gzip --file "${archive_path}" \
          --directory "${install_root}" \
          --no-same-owner \
          actionlint
        printf 'ACTIONLINT=%s/actionlint\n' "${install_root}" >> "${GITHUB_ENV}"

    - name: Validate workflow syntax
      shell: bash
      run: |
        set -euo pipefail

        workflow_files=()
        while IFS= read -r -d '' workflow_file; do
          workflow_files+=("${workflow_file}")
        done < <(
          find .github/workflows -maxdepth 1 -type f \
            \( -name '*.yaml' -o -name '*.yml' \) \
            -print0 | sort --zero-terminated
        )
        (( ${#workflow_files[@]} > 0 )) || {
          printf 'No workflows were found in .github/workflows.\n' >&2
          exit 2
        }
        "${ACTIONLINT}" \
          -config-file .github/actionlint.yaml \
          "${workflow_files[@]}"

    - name: Validate local action metadata
      shell: bash
      env:
        ACTION_VALIDATOR_VERSION: "${{ inputs.action-validator-version }}"
        npm_config_cache: "${{ runner.temp }}/empathy-npm-cache"
      run: |
        set -euo pipefail
        [[ "${ACTION_VALIDATOR_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          printf 'action-validator-version must be exact: %s\n' \
            "${ACTION_VALIDATOR_VERSION}" >&2
          exit 2
        }
        command -v npx >/dev/null || {
          printf 'npx is required to validate local action metadata.\n' >&2
          exit 127
        }

        while IFS= read -r -d '' action_file; do
          npx --yes "@action-validator/cli@${ACTION_VALIDATOR_VERSION}" \
            "${action_file}"
        done < <(find .github/actions -name action.yml -type f -print0 | sort --zero-terminated)

    - name: Enforce automation policy
      shell: bash
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/validate_automation.py" \
          --repository-root "${GITHUB_WORKSPACE}"
