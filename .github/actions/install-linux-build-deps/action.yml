name: Install Linux Build Dependencies
description: Installs the shared Linux system packages required by Flutter builds.

runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes \
          clang \
          cmake \
          ninja-build \
          pkg-config \
          libgtk-3-dev \
          liblzma-dev \
          libsecret-1-dev
