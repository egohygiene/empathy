---
# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json

version: 2

# Scope and deferred owner-managed roots: docs/security/dependency-coverage.md.
# Keep Actions separate: PR #121 records the merged approved Actions selection.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # npm is Dependabot's ecosystem for the retained root pnpm graph.
  # Do not recursively enroll specialist copies, templates, or frozen intake.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      root-runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      root-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      root-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Forward-compatible baseline: root Python currently has no dependencies.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 1
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-runtime:
        dependency-type: production
        patterns:
          - "*"
      python-tooling:
        dependency-type: development
        patterns:
          - "*"
