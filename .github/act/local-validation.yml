name: Local Empathy consumer validation

# Explicit act target outside .github/workflows; GitHub never schedules it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Copy the selected working tree through act checkout emulation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; emulated by act
      - name: Verify the selected consumer composition without external dependencies
        run: python3 -B -m unittest discover --start-directory tests --pattern 'test_local_ci_consumer.py' --verbose
      - name: Check tracked whitespace
        run: git diff --check
