---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Refresh contributors

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "contributors-${{ github.repository }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  contributors:
    name: Generate contributor documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.20.0; observe egress before enforcing.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout target branch
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: "${{ github.ref_name }}"

      - name: Generate contributor documentation
        uses: ./.github/actions/contributors

      - name: Commit contributor changes
        uses: ./.github/actions/commit-if-changed
        with:
          paths: |
            .allcontributorsrc
            CONTRIBUTORS.md
          commit-message: "docs(contributors): refresh contributor metadata [skip ci]"
          target-branch: "${{ github.ref_name }}"
