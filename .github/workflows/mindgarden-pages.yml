---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish Mindgarden

on:
  pull_request:
    paths:
      - ".garden/**"
      - ".github/workflows/mindgarden-pages.yml"
      - ".reports/*/summary.json"
      - "mindgarden/**"
      - "tests/test_mindgarden_publishing_integration.py"
      - "Taskfile.yml"
  push:
    branches:
      - main
    paths:
      - ".garden/**"
      - ".github/workflows/mindgarden-pages.yml"
      - ".reports/*/summary.json"
      - "mindgarden/**"
      - "tests/test_mindgarden_publishing_integration.py"
      - "Taskfile.yml"
  workflow_run:
    workflows:
      - MegaLinter
      - OpenSSF Scorecard
      - "🔍 OSV Vulnerability Scan"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "mindgarden-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build public garden
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.20.0; observe egress before enforcing.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout complete repository history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        # actions/setup-node v6.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Verify deterministic public boundary
        run: >-
          python3 mindgarden/scripts/publish_garden.py
          --repository-root .
          verify

      - name: Build the pinned Quartz site
        run: >-
          python3 mindgarden/scripts/quartz_site.py
          --repository-root .
          build

      - name: Generate repository intelligence dashboard
        uses: egohygiene/relay/actions/repository-intelligence@55587de4ff322931d401e964f5af0716633dd675 # v1.3.0
        with:
          output-directory: ".cache/mindgarden/site/intelligence"
          work-directory: ".cache/mindgarden/repository-intelligence"
          reports-directory: ".reports"
          activity-since: "1 year ago"
          max-depth: "10"
          require-full-history: "true"

      - name: Configure GitHub Pages
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
          github.event.workflow_run.event != 'pull_request' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch)
        # actions/configure-pages v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload GitHub Pages artifact
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
          github.event.workflow_run.event != 'pull_request' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch)
        # actions/upload-pages-artifact v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ".cache/mindgarden/site"

  deploy:
    name: Deploy public garden
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.20.0; observe egress before enforcing.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v5.0.0
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
