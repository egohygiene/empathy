---
name: NSFW Detection

on:
  workflow_dispatch: # Allows manual triggering only
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - '**.png'
  #     - '**.jpg'
  #     - '**.jpeg'
  #     - '**.gif'
  # pull_request:
  #   paths:
  #     - '**.png'
  #     - '**.jpg'
  #     - '**.jpeg'
  #     - '**.gif'

permissions:
  contents: read

jobs:
  nsfw-detection:
    name: NSFW Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run NSFW Detection
        uses: fabasoad/nsfw-detection-action@84dfcb183b5ad70af6506f75223e5b6783e9c7d4 # v3.0.2
        with:
          api-key: ${{ secrets.NSFW_API_KEY }}
          folder: .
          extensions: png,jpg,jpeg,gif
          fail-on-detection: false
