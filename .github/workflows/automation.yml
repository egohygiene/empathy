---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Validate automation

on:
  pull_request:
    paths:
      - ".github/**"
      - ".audits/**"
      - ".reports/README.md"
      - ".czrc"
      - ".mega-linter.yml"
      - ".prettierignore"
      - ".secrets.baseline"
      - ".gitattributes"
      - ".gitignore"
      - "LICENSES/**"
      - "REUSE.toml"
      - "Taskfile.yml"
      - "egolint/**"
      - "foundation/**"
      - "schemas/repository-foundation-*.schema.json"
      - "tools/foundation*.py"
      - "tools/baseline_tests.py"
      - "tools/task_catalog.py"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - ".audits/**"
      - ".reports/README.md"
      - ".czrc"
      - ".mega-linter.yml"
      - ".prettierignore"
      - ".secrets.baseline"
      - ".gitattributes"
      - ".gitignore"
      - "LICENSES/**"
      - "REUSE.toml"
      - "Taskfile.yml"
      - "egolint/**"
      - "foundation/**"
      - "schemas/repository-foundation-*.schema.json"
      - "tools/foundation*.py"
      - "tools/baseline_tests.py"
      - "tools/task_catalog.py"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "automation-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workflows and actions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.20.0; observe egress before enforcing.
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit

      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate GitHub automation
        uses: ./.github/actions/validate-automation

      - name: Validate repository policy tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 tools/baseline_tests.py \
            --output-directory "${RUNNER_TEMP}/baseline-unittest" \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Retain independent baseline test results
        if: ${{ !cancelled() && (success() || failure()) }}
        # actions/upload-artifact v7.0.0
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "baseline-unittest-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/baseline-unittest/"
          if-no-files-found: warn
          retention-days: 14
