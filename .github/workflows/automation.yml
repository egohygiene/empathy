---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Validate automation

on:
  pull_request:
    paths:
      - ".github/**"
      - ".audits/**"
      - ".reports/README.md"
      - ".czrc"
      - ".mega-linter.yml"
      - ".prettierignore"
      - ".secrets.baseline"
      - ".staging/github/**"
      - ".gitattributes"
      - ".gitignore"
      - "LICENSES/**"
      - "REUSE.toml"
      - "Taskfile.yml"
      - "egolint/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - ".audits/**"
      - ".reports/README.md"
      - ".czrc"
      - ".mega-linter.yml"
      - ".prettierignore"
      - ".secrets.baseline"
      - ".staging/github/**"
      - ".gitattributes"
      - ".gitignore"
      - "LICENSES/**"
      - "REUSE.toml"
      - "Taskfile.yml"
      - "egolint/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "automation-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workflows and actions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate GitHub automation
        uses: ./.github/actions/validate-automation

      - name: Validate repository policy tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            --start-directory tests \
            --pattern "test_*.py" \
            --verbose
          python3 -m unittest discover \
            --start-directory egolint/tests \
            --pattern "test_*.py" \
            --verbose
