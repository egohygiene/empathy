---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Validate automation

on:
  pull_request:
    paths:
      - ".github/**"
      - ".audits/**"
      - ".reports/README.md"
      - ".czrc"
      - ".mega-linter.yml"
      - ".prettierignore"
      - ".secrets.baseline"
      - ".gitattributes"
      - ".gitignore"
      - "LICENSES/**"
      - "REUSE.toml"
      - "Taskfile.yml"
      - "egolint/**"
      - "foundation/**"
      - "schemas/repository-foundation-*.schema.json"
      - "tools/foundation*.py"
      - "tests/**"
      - ".staging/**"
      - "migration/**"
      - "tools/staging_*.py"
      - "schemas/staging-*.schema.json"
      - "docs/migration/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - ".audits/**"
      - ".reports/README.md"
      - ".czrc"
      - ".mega-linter.yml"
      - ".prettierignore"
      - ".secrets.baseline"
      - ".gitattributes"
      - ".gitignore"
      - "LICENSES/**"
      - "REUSE.toml"
      - "Taskfile.yml"
      - "egolint/**"
      - "foundation/**"
      - "schemas/repository-foundation-*.schema.json"
      - "tools/foundation*.py"
      - "tests/**"
      - ".staging/**"
      - "migration/**"
      - "tools/staging_*.py"
      - "schemas/staging-*.schema.json"
      - "docs/migration/**"
  workflow_dispatch:
    inputs:
      staging_base:
        description: Full reviewed ancestor commit for the immutable staging diff.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "automation-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  staging:
    name: Validate staging preimages and durable receipt bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit

      - name: Read the exact reviewed head and its source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check actual base/head staging changes and committed ledger freshness
        env:
          STAGING_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.staging_base }}
          STAGING_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tools/staging_diff_gate.py \
            --repository-root . --base "$STAGING_BASE" --head "$STAGING_HEAD"

  validate:
    name: Validate workflows and actions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.20.0; observe egress before enforcing.
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit

      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate GitHub automation
        uses: ./.github/actions/validate-automation

      - name: Validate repository policy tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 -m unittest discover \
            --start-directory tests \
            --pattern "test_*.py" \
            --verbose
          python3 -m unittest discover \
            --start-directory egolint/tests \
            --pattern "test_*.py" \
            --verbose
