---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Validate Mantle

on:
  pull_request:
    paths:
      - ".github/workflows/mantle.yml"
      - ".vscode/tasks.json"
      - "Taskfile.yml"
      - "mantle/**"
      - "tests/test_mantle_ci.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mantle.yml"
      - ".vscode/tasks.json"
      - "Taskfile.yml"
      - "mantle/**"
      - "tests/test_mantle_ci.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "mantle-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: "${{ matrix.system }} / Bash, Zsh, Fish"
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux
            runner: ubuntu-24.04
          - system: macOS
            runner: macos-15

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.20.0; audit mode supports this matrix.
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Linux shell dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update --quiet
          sudo apt-get install --yes \
            bats \
            fish \
            gawk \
            shellcheck \
            zsh

      - name: Install macOS shell dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install \
            bats-core \
            fish \
            gawk \
            shellcheck

      - name: Install pinned shdoc
        shell: bash
        env:
          SHDOC_COMMIT: "b3436134f08428f8bbe2e54bc4dc20da85cd300b"
        run: |
          set -euo pipefail
          shdoc_root="${RUNNER_TEMP}/mantle-shdoc"
          shdoc_bin="${RUNNER_TEMP}/mantle-tools"
          mkdir -p "${shdoc_root}" "${shdoc_bin}"
          git -C "${shdoc_root}" init --quiet
          git -C "${shdoc_root}" remote add origin \
            "https://github.com/reconquest/shdoc.git"
          git -C "${shdoc_root}" fetch --depth 1 origin "${SHDOC_COMMIT}"
          git -C "${shdoc_root}" checkout --detach FETCH_HEAD
          install -m 0755 "${shdoc_root}/shdoc" "${shdoc_bin}/shdoc"
          printf '%s\n' "${shdoc_bin}" >> "${GITHUB_PATH}"

      - name: Install locked shfmt through Mantle
        shell: bash
        run: |
          set -euo pipefail
          shfmt_bin="${RUNNER_TEMP}/mantle-tools"
          ./mantle/bin/mantle install shfmt \
            --no-verify \
            --install-dir "${shfmt_bin}"
          printf '%s\n' "${shfmt_bin}" >> "${GITHUB_PATH}"

      - name: Install checksum-verified Fastfetch
        shell: bash
        env:
          FASTFETCH_VERSION: "2.67.0"
          FASTFETCH_LINUX_AMD64_SHA256: "f14538f30286f83affe129c8fb874d2b13c669365fa2e71533986d188c6c5af1"
          FASTFETCH_MACOS_AARCH64_SHA256: "938dbdd6091d963f91537302fe822703b86a0af5af66c7e0e63eb1b0936d9e5a"
          FASTFETCH_MACOS_AMD64_SHA256: "ac3479db2c50c97e41e7bd675b5a85096479b537a360f9dd940b8b42bf6df871"
        run: |
          set -euo pipefail

          case "${RUNNER_OS}:$(uname -m)" in
            Linux:x86_64)
              asset="fastfetch-linux-amd64.tar.gz"
              checksum="${FASTFETCH_LINUX_AMD64_SHA256}"
              ;;
            macOS:arm64)
              asset="fastfetch-macos-aarch64.tar.gz"
              checksum="${FASTFETCH_MACOS_AARCH64_SHA256}"
              ;;
            macOS:x86_64)
              asset="fastfetch-macos-amd64.tar.gz"
              checksum="${FASTFETCH_MACOS_AMD64_SHA256}"
              ;;
            *)
              printf 'Unsupported Fastfetch CI platform: %s / %s\n' \
                "${RUNNER_OS}" "$(uname -m)" >&2
              exit 1
              ;;
          esac

          archive="${RUNNER_TEMP}/${asset}"
          install_root="${RUNNER_TEMP}/mantle-fastfetch"
          tool_bin="${RUNNER_TEMP}/mantle-tools"
          url="https://github.com/fastfetch-cli/fastfetch/releases/download/${FASTFETCH_VERSION}/${asset}"

          curl --fail --location --silent --show-error \
            "${url}" \
            --output "${archive}"
          printf '%s  %s\n' "${checksum}" "${archive}" | shasum -a 256 --check

          mkdir -p "${install_root}" "${tool_bin}"
          tar -xzf "${archive}" -C "${install_root}"

          fastfetch_path=""
          while IFS= read -r candidate; do
            if [[ -x "${candidate}" ]]; then
              fastfetch_path="${candidate}"
              break
            fi
          done < <(find "${install_root}" -type f -name fastfetch -print)

          if [[ -z "${fastfetch_path}" ]]; then
            printf 'Fastfetch executable was not present in %s.\n' "${asset}" >&2
            exit 1
          fi

          ln -sf "${fastfetch_path}" "${tool_bin}/fastfetch"
          printf '%s\n' "${tool_bin}" >> "${GITHUB_PATH}"
          "${tool_bin}/fastfetch" --version | grep -F "${FASTFETCH_VERSION}"

      - name: Report shell matrix
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash --version | head -n 1
          zsh --version
          fish --version
          bats --version
          shellcheck --version
          printf 'shdoc: %s\n' "$(command -v shdoc)"
          shfmt --version
          fastfetch --version

      - name: Validate and execute the Fastfetch presentation contract
        shell: bash
        working-directory: mantle
        run: |
          set -euo pipefail
          python3 tests/validate_fastfetch.py
          PATH="${PWD}/bin:${PATH}" fastfetch \
            --config config/fastfetch/fastfetch.jsonc \
            > "${RUNNER_TEMP}/mantle-fastfetch-output.txt"
          test -s "${RUNNER_TEMP}/mantle-fastfetch-output.txt"

      - name: Run strict Mantle validation
        shell: bash
        working-directory: mantle
        run: ./tests/run.sh --strict

      - name: Run temporary-prefix installation smoke test
        shell: bash
        working-directory: mantle
        run: /bin/bash ./tests/smoke/install.sh
