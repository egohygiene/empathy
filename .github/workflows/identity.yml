---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Validate Identity consumer

on:
  pull_request:
    paths:
      - ".gitmodules"
      - ".config/identity/**"
      - ".identity/**"
      - ".github/workflows/identity.yml"
      - ".tasks/identity.yml"
      - "docs/integrations/IDENTITY.md"
      - "identity"
      - "identity/**"
      - "tests/test_identity_integration.py"
      - "Taskfile.yml"
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - ".config/identity/**"
      - ".identity/**"
      - ".github/workflows/identity.yml"
      - ".tasks/identity.yml"
      - "docs/integrations/IDENTITY.md"
      - "identity"
      - "identity/**"
      - "tests/test_identity_integration.py"
      - "Taskfile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "identity-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate immutable Identity consumer and Empathy contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.20.0; observe egress before enforcing.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout repository and pinned Identity source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Verify immutable consumer pin
        shell: bash
        run: |
          set -euo pipefail
          expected_revision="$(python3 - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path(".config/identity/consumer-lock.json").read_text(encoding="utf-8"))
          assert lock["schema"] == "identity.consumer-lock/v1"
          assert lock["repository"] == "egohygiene/identity"
          assert lock["revision_kind"] == "git-commit"
          print(lock["revision"])
          PY
          )"
          tree_revision="$(git ls-tree "HEAD" "identity" | awk '{print $3}')"
          worktree_revision="$(git -C "identity" rev-parse "HEAD")"
          test "${tree_revision}" = "${expected_revision}"
          test "${worktree_revision}" = "${expected_revision}"
          test -z "$(git -C "identity" status --short)"
          git submodule status --recursive

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "1.97.1" \
            --profile "minimal" \
            --component "clippy,rustfmt"

      - name: Verify locked dependency resolution
        run: >-
          cargo metadata
          --manifest-path "identity/Cargo.toml"
          --locked
          --format-version "1"
          --no-deps

      - name: Verify formatting
        run: cargo fmt --manifest-path "identity/Cargo.toml" --all --check

      - name: Run Clippy
        run: >-
          cargo clippy
          --manifest-path "identity/Cargo.toml"
          --all-targets
          --all-features
          --
          -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path "identity/Cargo.toml" --all-features

      - name: Validate Empathy integration contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_identity_integration --verbose
          cargo run \
            --quiet \
            --manifest-path "identity/Cargo.toml" \
            -- \
            validate \
            --repository-root "."

      - name: Exercise deterministic handoff
        shell: bash
        run: |
          set -euo pipefail
          cargo run \
            --quiet \
            --manifest-path "identity/Cargo.toml" \
            -- \
            handoff \
            --repository-root "." \
            --output-directory ".cache/identity/ci-handoff"
          test -s ".cache/identity/ci-handoff/identity-handoff.md"
          test -s ".cache/identity/ci-handoff/candidate-manifest.template.json"
          test -s ".cache/identity/ci-handoff/handoff-manifest.json"
