---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "scorecard-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  scorecard:
    name: Evaluate repository security posture
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        # ossf/scorecard-action v2.4.4
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        if: always()
        # github/codeql-action v4.37.6
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          sarif_file: results.sarif
          category: ossf-scorecard

      - name: Upload Scorecard artifact
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "ossf-scorecard-${{ github.run_id }}-${{ github.run_attempt }}"
          path: results.sarif
          retention-days: 90
          if-no-files-found: error
