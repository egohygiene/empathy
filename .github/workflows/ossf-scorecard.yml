---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".reports/**"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "scorecard-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  scorecard:
    name: Evaluate repository security posture
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.20.0; observe egress before enforcing.
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit

      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        # ossf/scorecard-action v2.4.4
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        if: always()
        # github/codeql-action v4.37.6
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: results.sarif
          category: ossf-scorecard

      - name: Upload Scorecard artifact
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "ossf-scorecard-${{ github.run_id }}-${{ github.run_attempt }}"
          path: results.sarif
          retention-days: 90
          if-no-files-found: error

  publish-summary:
    name: Publish normalized Scorecard summary
    needs: scorecard
    if: >-
      always() &&
      needs.scorecard.result != 'cancelled' &&
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.20.0; observe egress before enforcing.
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit

      - name: Checkout default branch
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: "${{ github.event.repository.default_branch }}"

      - name: Clear the previous Scorecard summary
        shell: bash
        run: |
          set -euo pipefail
          git rm --force --recursive --ignore-unmatch -- ".reports/scorecard"
          mkdir --parents ".cache/scorecard" ".reports/scorecard"

      - name: Download Scorecard SARIF
        continue-on-error: true
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: "ossf-scorecard-${{ github.run_id }}-${{ github.run_attempt }}"
          path: .cache/scorecard

      - name: Read the commit-matched official Scorecard aggregate
        id: scorecard-api
        shell: bash
        env:
          SCORECARD_API_URL: >-
            https://api.scorecard.dev/projects/github.com/${{ github.repository }}
        run: |
          set -euo pipefail

          api_path="${RUNNER_TEMP}/scorecard-api.json"
          candidate_path="${api_path}.candidate"
          rm --force "${api_path}" "${candidate_path}"

          for attempt in 1 2 3 4 5; do
            if curl \
              --fail \
              --location \
              --max-time 20 \
              --output "${candidate_path}" \
              --retry 2 \
              --retry-delay 1 \
              --show-error \
              --silent \
              "${SCORECARD_API_URL}"; then
              mv "${candidate_path}" "${api_path}"
              if jq \
                --arg commit "${GITHUB_SHA}" \
                --exit-status \
                '.repo.commit == $commit' \
                "${api_path}" > /dev/null; then
                break
              fi
            fi

            if (( attempt < 5 )); then
              sleep 5
            fi
          done

          if [[ -s "${api_path}" ]]; then
            printf 'path=%s\n' "${api_path}" >> "${GITHUB_OUTPUT}"
          else
            printf 'path=\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Normalize repository-intelligence summary
        uses: egohygiene/relay/actions/normalize-repository-report@1eada5142f7fc7da7862f335589e3b8f5884ffaf # v1.5.0
        with:
          producer: scorecard
          input: .cache/scorecard/results.sarif
          output: .reports/scorecard/summary.json
          scorecard-api-input: "${{ steps.scorecard-api.outputs.path }}"

      - name: Publish stable Scorecard summary
        uses: egohygiene/relay/actions/publish-report-snapshot@1eada5142f7fc7da7862f335589e3b8f5884ffaf # v1.5.0
        with:
          paths: .reports/scorecard
          default-branch: "${{ github.event.repository.default_branch }}"
          commit-message: >-
            chore(reports): 📊 refresh Scorecard snapshot [skip ci]
