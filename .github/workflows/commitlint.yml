---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Validate commits

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: "commitlint-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  commitlint:
    name: Validate emoji Conventional Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.20.0; observe egress before enforcing.
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Checkout complete pull request history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.5.0"

      - name: Install the locked commit policy
        shell: bash
        env:
          COREPACK_HOME: "${{ runner.temp }}/empathy-corepack"
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          sh egolint/scripts/pnpm.sh --dir egolint install \
            --frozen-lockfile \
            --ignore-scripts

      - name: Lint commit messages
        shell: bash
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: |
          set -euo pipefail
          sh egolint/scripts/pnpm.sh --dir egolint exec commitlint \
            --config .config/lint/commits/commitlint.emoji.config.cjs \
            --from "${BASE_SHA}" \
            --to "${HEAD_SHA}" \
            --verbose
