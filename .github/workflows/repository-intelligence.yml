---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Generate repository intelligence

on:
  pull_request:
    paths:
      - ".github/workflows/repository-intelligence*.yml"
      - "tools/*repository_intelligence*.py"
      - "tests/test_repository_intelligence*.py"
      - "docs/integrations/REPOSITORY_INTELLIGENCE.md"
  workflow_dispatch:
    inputs:
      output-root:
        description: Private workspace; only public dashboard bytes are uploaded.
        required: true
        default: ".cache/repository-intelligence"
        type: string
      dashboard-output-root:
        description: Repository-relative directory for the static dashboard bundle.
        required: true
        default: ".cache/mindgarden/site/intelligence"
        type: string
      max-depth:
        description: Maximum tree depth.
        required: true
        default: "10"
        type: string
      activity-since:
        description: Git-compatible activity start date.
        required: true
        default: "1 year ago"
        type: string
      review-plan:
        description: Repository-relative typed public review plan; absent report selections stay unavailable.
        required: false
        default: ".config/repository-intelligence/review-plan.json"
        type: string

permissions:
  contents: read

concurrency:
  group: "consumer-repository-intelligence-${{ github.repository }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  generate:
    name: Generate read-only review evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Harden Runner
        id: harden
        # step-security/harden-runner v2.22.4; preserve existing audit policy.
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit

      - name: Checkout complete repository history
        id: checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate normalized report inputs
        id: inputs
        run: >-
          python3 tools/repository_intelligence_publication.py collect-input-evidence
          --repository-root .
          --output .cache/repository-intelligence-publication/inputs.json

      - name: Capture public Work, Health and Releases sources
        id: public_sources
        if: github.event_name == 'workflow_dispatch'
        uses: egohygiene/relay/actions/repository-intelligence-github-sources@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          github-token: "${{ github.token }}"
          include-titles: "true"

      - name: Retain exact same-run source captures
        id: source_capture_upload
        if: github.event_name == 'workflow_dispatch'
        # Ordinary immutable capture artifact; never a Pages upload.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "${{ steps.public_sources.outputs.artifact-name }}"
          path: "${{ steps.public_sources.outputs.artifact-directory }}"
          if-no-files-found: error
          retention-days: 7

      - name: Normalize selected public Audits and Sanity reports
        id: review_feed
        if: github.event_name == 'workflow_dispatch'
        # Reviewed typed feed source; original report times and human authority remain separate.
        uses: egohygiene/relay/actions/repository-intelligence-review-feed@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          source-root: "."
          plan: "${{ inputs.review-plan || '.config/repository-intelligence/review-plan.json' }}"
          repository: "${{ github.repository }}"
          represented-commit: "${{ github.sha }}"
          as-of: "${{ steps.public_sources.outputs.as-of }}"
          output-directory: ".cache/repository-intelligence-review-feed"

      - name: Retain separate normalized review feed evidence
        id: review_feed_upload
        if: ${{ always() && github.event_name == 'workflow_dispatch' && steps.review_feed.outputs.artifact-directory != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "empathy-intelligence-owner-reviews-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ steps.review_feed.outputs.artifact-directory }}"
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Generate intelligence artifacts and dashboard
        id: intelligence
        # Portable Relay candidate; qualify the exact source before readiness.
        uses: egohygiene/relay/actions/repository-intelligence@5d27be5ce1599df883e31f14cd894eb18622c18c
        with:
          output-directory: "${{ inputs.dashboard-output-root || '.cache/mindgarden/site/intelligence' }}"
          work-directory: "${{ inputs.output-root || '.cache/repository-intelligence' }}"
          reports-directory: ".reports"
          collect-journey: "true"
          search-attribution: "true"
          collect-dependencies: "${{ steps.source_capture_upload.outputs.artifact-id != '' }}"
          source-capture-artifact-id: "${{ steps.source_capture_upload.outputs.artifact-id }}"
          source-capture-artifact-digest: "${{ steps.source_capture_upload.outputs.artifact-digest }}"
          as-of: "${{ steps.public_sources.outputs.as-of }}"
          observatory-audits: "${{ steps.review_feed.outputs.repository-audits }}"
          observatory-sanity: "${{ steps.review_feed.outputs.repository-sanity }}"
          activity-since: "${{ inputs.activity-since || '1 year ago' }}"
          max-depth: "${{ inputs.max-depth || '10' }}"
          require-full-history: "true"

      - name: Upload public intelligence review artifact
        id: review_artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "empathy-intelligence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ inputs.dashboard-output-root || '.cache/mindgarden/site/intelligence' }}"
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Preserve sanitized run evidence
        if: ${{ always() }}
        env:
          HARDEN_RESULT: ${{ steps.harden.outcome }}
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          INPUT_RESULT: ${{ steps.inputs.outcome }}
          CAPTURE_EXPECTED: ${{ github.event_name == 'workflow_dispatch' }}
          CAPTURE_RESULT: ${{ steps.public_sources.outcome }}
          CAPTURE_UPLOAD_RESULT: ${{ steps.source_capture_upload.outcome }}
          REVIEW_FEED_RESULT: ${{ steps.review_feed.outcome }}
          REVIEW_FEED_UPLOAD_RESULT: ${{ steps.review_feed_upload.outcome }}
          BUILD_RESULT: ${{ steps.intelligence.outcome }}
          ARTIFACT_RESULT: ${{ steps.review_artifact.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          stages = [("harden", "HARDEN_RESULT"), ("checkout", "CHECKOUT_RESULT"), ("inputs", "INPUT_RESULT"),
                    ("intelligence", "BUILD_RESULT"), ("review_artifact", "ARTIFACT_RESULT")]
          if os.environ["CAPTURE_EXPECTED"] == "true":
              stages[3:3] = [("public_sources", "CAPTURE_RESULT"), ("source_capture_upload", "CAPTURE_UPLOAD_RESULT"),
                             ("review_feed", "REVIEW_FEED_RESULT"), ("review_feed_upload", "REVIEW_FEED_UPLOAD_RESULT")]
          allowed = {"success", "failure", "cancelled", "skipped"}
          observed = {}
          for stage, key in stages:
              result = os.environ.get(key)
              observed[stage] = result if result in allowed else "unavailable"
          failed = next((stage for stage, _ in stages if observed[stage] != "success"), None)
          diagnostics = {
              "harden": ("EMRI-001", "Restore runner hardening before rebuilding."),
              "checkout": ("EMRI-001", "Restore the complete immutable consumer checkout."),
              "inputs": ("EMRI-003", "Inspect normalized snapshot schema and provenance; retain unknown or stale evidence."),
              "public_sources": ("EMRI-011", "Restore bounded public source admission without relabeling unavailable evidence."),
              "source_capture_upload": ("EMRI-011", "Restore exact same-run source capture retention and digest handoff."),
              "review_feed": ("EMRI-012", "Restore typed public review admission at the actual capture clock."),
              "review_feed_upload": ("EMRI-012", "Restore separate review feed evidence retention."),
              "intelligence": ("EMRI-006", "Inspect the pinned Relay generation and public-safe diagnostic evidence."),
              "review_artifact": ("EMRI-008", "Restore the complete public review artifact upload."),
          }
          code, guidance = diagnostics[failed] if failed else (None, None)
          report = {
              "schema": "egohygiene.empathy.repository-intelligence-run/v1",
              "repository": "egohygiene/empathy",
              "revision": os.environ["GITHUB_SHA"],
              "run": {"id": int(os.environ["GITHUB_RUN_ID"]), "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"])},
              "stage": failed or "complete",
              "conclusion": "failure" if failed else "success",
              "error_code": code,
              "rule": "empathy.intelligence." + (failed or "complete"),
              "observed": observed,
              "remediation": guidance,
              "documentation": "/".join(("https://github.com", "egohygiene/empathy", "blob",
                                         os.environ["GITHUB_SHA"], "docs/integrations/REPOSITORY_INTELLIGENCE.md")),
              "authority": "contents-read-artifact-only",
              "sanitization": "allowlisted-metadata-only",
          }
          encoded = json.dumps(report, indent=2, sort_keys=True) + "\n"
          if len(encoded.encode("utf-8")) > 8192:
              raise SystemExit("intelligence evidence exceeds the bounded report size")
          target = Path(os.environ["RUNNER_TEMP"]) / "empathy-intelligence-run.json"
          target.write_text(encoded, encoding="utf-8")
          if failed:
              raise SystemExit("Repository Intelligence generation failed; inspect the sanitized report")
          PYTHON

      - name: Retain sanitized run evidence for 30 days
        if: ${{ always() }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "empathy-intelligence-report-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            ${{ runner.temp }}/empathy-intelligence-run.json
            ${{ steps.public_sources.outputs.producer-receipt }}
            ${{ steps.review_feed.outputs.receipt-path }}
          if-no-files-found: error
          retention-days: 30
