---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "🧠 Repository Intelligence"

on:
  workflow_dispatch:

  push:
    branches:
      - "main"
      - "master"
    # The workflow writes only this directory. Ignoring it prevents the bot's
    # generated commit from triggering another generation run.
    paths-ignore:
      - "docs/generated/**"

permissions:
  contents: write

concurrency:
  group: "repository-intelligence-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  generate:
    name: "🧠 Generate Repository Intelligence"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout repository"
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Activity intelligence is invalid when only the triggering commit is
          # present, so always retrieve complete branch and tag history.
          fetch-depth: 0

      - name: "🧠 Generate intelligence artifacts"
        uses: ./.github/actions/generate-repository-intelligence
        with:
          output-root: "docs/generated"
          max-depth: "10"
          activity-since: "1 year ago"
          activity-ref: "HEAD"
          require-full-history: "true"

      - name: "💾 Commit generated artifacts"
        shell: bash
        env:
          OUTPUT_ROOT: "docs/generated"
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${OUTPUT_ROOT}"

          if git diff --cached --quiet; then
            printf 'No repository intelligence changes detected.\n'
            exit 0
          fi

          git commit --message "docs: refresh repository intelligence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
