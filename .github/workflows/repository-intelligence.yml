---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Generate repository intelligence

on:
  workflow_dispatch:
    inputs:
      output-root:
        description: Repository-relative artifact directory.
        required: true
        default: "docs/generated"
        type: string
      max-depth:
        description: Maximum tree depth.
        required: true
        default: "10"
        type: string
      activity-since:
        description: Git-compatible activity start date.
        required: true
        default: "1 year ago"
        type: string

permissions:
  contents: read

concurrency:
  group: "repository-intelligence-${{ github.repository }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  generate:
    name: Generate deterministic repository artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout complete repository history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate intelligence artifacts
        uses: ./.github/actions/generate-repository-intelligence
        with:
          output-root: "${{ inputs.output-root }}"
          max-depth: "${{ inputs.max-depth }}"
          activity-since: "${{ inputs.activity-since }}"
          activity-ref: "HEAD"
          require-full-history: "true"

      - name: Upload intelligence artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "repository-intelligence-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ inputs.output-root }}"
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
