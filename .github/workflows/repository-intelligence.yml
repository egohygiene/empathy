---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Generate repository intelligence

on:
  workflow_dispatch:
    inputs:
      output-root:
        description: Repository-relative directory for tree and activity artifacts.
        required: true
        default: "docs/generated"
        type: string
      dashboard-output-root:
        description: Repository-relative directory for the static dashboard bundle.
        required: true
        default: ".cache/mindgarden/site/intelligence"
        type: string
      max-depth:
        description: Maximum tree depth.
        required: true
        default: "10"
        type: string
      activity-since:
        description: Git-compatible activity start date.
        required: true
        default: "1 year ago"
        type: string

permissions:
  contents: read

concurrency:
  group: "repository-intelligence-${{ github.repository }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  generate:
    name: Generate deterministic repository artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.20.0; observe egress before enforcing.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout complete repository history
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate intelligence artifacts and dashboard
        uses: egohygiene/relay/actions/repository-intelligence@ca6e9319d5133615c1b9e0b5ea5a4f5d3a113210 # v1.0.0
        with:
          output-directory: "${{ inputs.dashboard-output-root }}"
          work-directory: "${{ inputs.output-root }}"
          reports-directory: ".reports"
          activity-since: "${{ inputs.activity-since }}"
          max-depth: "${{ inputs.max-depth }}"
          require-full-history: "true"

      - name: Upload intelligence artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "repository-intelligence-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            ${{ inputs.output-root }}
            ${{ inputs.dashboard-output-root }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
