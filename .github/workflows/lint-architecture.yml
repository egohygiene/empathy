---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Generate lint architecture

on:
  pull_request:
    paths:
      - ".github/actions/generate-lint-infographic/**"
      - ".github/workflows/**"
      - ".mega-linter.yml"
      - ".reports/README.md"
      - "Taskfile.yml"
      - "egolint/.config/megalinter/**"
      - "egolint/.config/toolchain/**"
      - "egolint/.mega-linter*.yml"
      - "egolint/scripts/complementary_tools.py"
      - "egolint/scripts/validate_megalinter_policy.py"
  push:
    branches:
      - main
    paths:
      - ".github/actions/generate-lint-infographic/**"
      - ".github/workflows/**"
      - ".mega-linter.yml"
      - ".reports/README.md"
      - "Taskfile.yml"
      - "egolint/.config/megalinter/**"
      - "egolint/.config/toolchain/**"
      - "egolint/.mega-linter*.yml"
      - "egolint/scripts/complementary_tools.py"
      - "egolint/scripts/validate_megalinter_policy.py"
  schedule:
    - cron: "53 5 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "lint-architecture-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  generate:
    name: Generate deterministic architecture artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.20.0; observe egress before enforcing.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Generate lint architecture
        uses: ./.github/actions/generate-lint-infographic

      - name: Upload complete architecture artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "lint-architecture-${{ github.run_id }}-${{ github.run_attempt }}"
          path: .reports/egolint/architecture/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  publish-report:
    name: Publish curated architecture snapshot
    needs: generate
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.20.0; observe egress before enforcing.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout default branch
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: "${{ github.event.repository.default_branch }}"

      - name: Clear the previous architecture snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rm --force -r --ignore-unmatch -- \
            ".reports/egolint/architecture"

      - name: Download architecture artifact
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: "lint-architecture-${{ github.run_id }}-${{ github.run_attempt }}"
          path: .reports/egolint/architecture

      - name: Publish stable architecture snapshot
        uses: egohygiene/relay/actions/publish-report-snapshot@aaadf940c3470bd6beb2266619c3b95295635145 # v1.2.0
        with:
          paths: .reports/egolint/architecture
          default-branch: "${{ github.event.repository.default_branch }}"
          commit-message: >-
            chore(reports): 📊 refresh lint architecture [skip ci]
