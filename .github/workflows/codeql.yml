---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CodeQL analysis

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "codeql-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analyze:
    name: "Analyze ${{ matrix.language }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.20.0; observe egress before enforcing.
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # github/codeql-action v4.37.6
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: "${{ matrix.language }}"

      - name: Analyze repository
        # github/codeql-action v4.37.6
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: "/language:${{ matrix.language }}"
