---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Review dependency changes

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: "dependency-review-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  review:
    name: Review dependency risk
    if: vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        # step-security/harden-runner v2.22.4; observe egress before enforcing.
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit

      - name: Review dependency changes
        # actions/dependency-review-action v5.0.0
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          warn-only: false

      - name: Write policy summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '## Dependency review\n\n'
            printf 'The pull request dependency diff was checked for known vulnerabilities.\n\n'
            printf -- '- High and critical vulnerabilities block the workflow.\n'
            printf -- '- License policy remains a selectable repository profile concern.\n'
          } >> "${GITHUB_STEP_SUMMARY}"
