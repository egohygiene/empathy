---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Apply MegaLinter fixes

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "megalinter-fix-${{ github.repository }}"
  cancel-in-progress: false

jobs:
  fix:
    name: Apply fixes and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout target branch
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: "${{ github.ref_name }}"

      - name: Run MegaLinter auto-fixes
        id: megalinter
        continue-on-error: true
        # oxsecurity/megalinter v10.0.0
        uses: oxsecurity/megalinter@15e5b45552097e318c93de385779ce3b1084052c
        env:
          APPLY_FIXES: all
          GITHUB_TOKEN: "${{ github.token }}"
          VALIDATE_ALL_CODEBASE: true

      - name: Detect changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            printf 'changed=true\n' >> "${GITHUB_OUTPUT}"
            {
              printf '## MegaLinter auto-fix\n\n'
              printf 'The following paths changed:\n\n'
              git status --short | sed 's/^/- `/' | sed 's/$/`/'
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            printf 'changed=false\n' >> "${GITHUB_OUTPUT}"
            printf '## MegaLinter auto-fix\n\nNo auto-fixable changes were produced.\n' \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload MegaLinter reports
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "megalinter-fix-${{ github.run_id }}-${{ github.run_attempt }}"
          path: reports/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

      - name: Open auto-fix pull request
        if: steps.changes.outputs.changed == 'true'
        # peter-evans/create-pull-request v8.1.1
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: "${{ github.token }}"
          add-paths: "."
          branch: "automation/megalinter-fixes"
          delete-branch: true
          commit-message: "chore(lint): apply MegaLinter fixes"
          title: "chore(lint): apply MegaLinter fixes"
          body: |
            MegaLinter generated this pull request from the repository's pinned
            lint policy. Review the complete diff before merging; formatter
            output can be mechanically correct while still changing intent.

            Validation reports are attached to the triggering workflow run.
          draft: true
