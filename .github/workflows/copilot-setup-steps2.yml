name: Copilot Setup Steps

# Pre-installs tools and dependencies in the Copilot coding agent environment.
# Runs automatically when this file changes, and can be triggered manually via
# the Actions tab to verify the setup works correctly.
# See: https://docs.github.com/en/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/flutter-setup/action.yml
      - .github/actions/flutter-generate/action.yml
      - .github/actions/install-linux-build-deps/action.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/flutter-setup/action.yml
      - .github/actions/flutter-generate/action.yml
      - .github/actions/install-linux-build-deps/action.yml

permissions:
  contents: read

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup

      - name: Install Linux Build Dependencies
        uses: ./.github/actions/install-linux-build-deps

      - name: Generate Code
        uses: ./.github/actions/flutter-generate
