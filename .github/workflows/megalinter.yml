---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: MegaLinter

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "megalinter-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint repository baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run MegaLinter
        id: megalinter
        # oxsecurity/megalinter v10.0.0
        uses: oxsecurity/megalinter@15e5b45552097e318c93de385779ce3b1084052c
        env:
          APPLY_FIXES: none
          GITHUB_TOKEN: "${{ github.token }}"
          VALIDATE_ALL_CODEBASE: >-
            ${{ github.event_name != 'pull_request' }}

      - name: Upload MegaLinter reports
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "megalinter-${{ github.run_id }}-${{ github.run_attempt }}"
          path: reports/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
