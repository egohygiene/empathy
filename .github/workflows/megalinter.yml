---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: MegaLinter

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - ".reports/**"
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "megalinter-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint selected MegaLinter profile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run MegaLinter
        id: megalinter
        # oxsecurity/megalinter v10.0.0
        uses: oxsecurity/megalinter@15e5b45552097e318c93de385779ce3b1084052c
        env:
          APPLY_FIXES: none
          GITHUB_TOKEN: "${{ github.token }}"
          # Pull requests use the deterministic changed-file profile. Trusted
          # branch, scheduled, and manual runs use the holistic configuration.
          MEGALINTER_CONFIG: >-
            ${{ github.event_name == 'pull_request'
            && 'egolint/.mega-linter.fast.yml'
            || '.mega-linter.yml' }}
          REPORT_OUTPUT_FOLDER: .reports/megalinter
          VALIDATE_ALL_CODEBASE: >-
            ${{ github.event_name != 'pull_request' }}

      - name: Publish MegaLinter summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary_path=".reports/megalinter/megalinter-summary.md"
          printf '## MegaLinter\n\n' >> "${GITHUB_STEP_SUMMARY}"
          if [[ -s "${summary_path}" ]]; then
            cat "${summary_path}" >> "${GITHUB_STEP_SUMMARY}"
          else
            printf 'No Markdown summary was generated.\n' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Inspect MegaLinter SARIF
        id: sarif
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sarif_path=".reports/megalinter/megalinter-report.sarif"
          if [[ -s "${sarif_path}" ]] &&
            jq -e '.runs | length > 0' "${sarif_path}" >/dev/null; then
            printf 'upload=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'upload=false\n' >> "${GITHUB_OUTPUT}"
            printf 'MegaLinter produced no SARIF runs; skipping code-scanning upload.\n'
          fi

      - name: Upload MegaLinter SARIF
        if: >-
          always() &&
          steps.sarif.outputs.upload == 'true' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        # github/codeql-action v4.37.6
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          sarif_file: .reports/megalinter/megalinter-report.sarif
          category: megalinter

      - name: Upload MegaLinter reports
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "megalinter-${{ github.run_id }}-${{ github.run_attempt }}"
          path: .reports/megalinter/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

  publish-reports:
    name: Publish curated MegaLinter snapshot
    needs: lint
    if: >-
      always() &&
      needs.lint.result != 'cancelled' &&
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: "${{ github.event.repository.default_branch }}"

      - name: Clear the previous MegaLinter snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rm --force --recursive --ignore-unmatch -- ".reports/megalinter"

      - name: Download MegaLinter reports
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: "megalinter-${{ github.run_id }}-${{ github.run_attempt }}"
          path: .reports/megalinter

      - name: Publish stable MegaLinter snapshot
        uses: ./.github/actions/publish-report-snapshot
        with:
          paths: .reports/megalinter
          default-branch: "${{ github.event.repository.default_branch }}"
          commit-message: >-
            chore(reports): 📊 refresh MegaLinter snapshot [skip ci]
