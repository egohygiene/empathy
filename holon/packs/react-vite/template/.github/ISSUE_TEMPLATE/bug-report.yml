name: Bug report
description: Report a reproducible template or generated-project defect.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping make the baseline dependable.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, app/profile, and the smallest reproduction.
      render: shell
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Runtime versions
      description: Output from `node --version` and `pnpm --version`.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, operating system, or suspected source profile.
