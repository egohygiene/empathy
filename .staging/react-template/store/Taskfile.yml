version: "3"

silent: true

tasks:
  setup:
    desc: Install the workspace dependencies.
    cmds:
      - corepack enable
      - pnpm install

  dev:
    desc: Run the storefront locally.
    cmds:
      - pnpm dev:store

  check:
    desc: Run all deterministic quality gates.
    cmds:
      - pnpm check

  test:e2e:
    desc: Run Playwright end-to-end tests.
    cmds:
      - pnpm exec playwright install chromium
      - pnpm test:e2e

  build:
    desc: Build the production storefront.
    cmds:
      - pnpm build

  clean:
    desc: Remove generated output.
    cmds:
      - pnpm clean
