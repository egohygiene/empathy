---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Review dependency changes

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "dependency-review-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency risk
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Review dependency changes
        # actions/dependency-review-action v5.0.0
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          warn-only: false

      - name: Write policy summary
        if: always()
        shell: bash
        run: |
          {
            printf '## Dependency review\n\n'
            printf 'The pull request dependency diff was checked for known vulnerabilities.\n\n'
            printf -- '- High and critical vulnerabilities block the workflow.\n'
            printf -- '- License policy remains a selectable profile concern.\n'
          } >> "${GITHUB_STEP_SUMMARY}"
