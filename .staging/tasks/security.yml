---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  LYNIS_PROFILE: '{{.LYNIS_PROFILE | default (joinPath .ROOT_DIR "lint/config/security/lynis/custom.prf")}}'
  LYNIS_REPORT_DIRECTORY: '{{.LYNIS_REPORT_DIRECTORY | default (joinPath .ROOT_DIR ".engineering/reports/lynis")}}'

tasks:
  _require-lynis:
    internal: true
    preconditions:
      - sh: command -v lynis >/dev/null 2>&1
        msg: Lynis is not installed or is not available on PATH.
      - sh: test -f "{{.LYNIS_PROFILE}}"
        msg: 'Lynis profile not found: {{.LYNIS_PROFILE}}'

  lynis:
    desc: Run a host security audit and save its log and report
    aliases: [audit]
    deps: [_require-lynis]
    platforms: [darwin, linux, freebsd, openbsd, netbsd]
    summary: |
      Runs Lynis without privilege escalation. Run Task itself through your
      preferred elevation mechanism if a complete privileged host audit is
      required.
    cmds:
      - mkdir -p "{{.LYNIS_REPORT_DIRECTORY}}"
      - >-
        lynis audit system
        --profile "{{.LYNIS_PROFILE}}"
        --quick
        --no-colors
        --log-file "{{.LYNIS_REPORT_DIRECTORY}}/lynis.log"
        --report-file "{{.LYNIS_REPORT_DIRECTORY}}/lynis-report.dat"

  lynis:version:
    desc: Print the installed Lynis version
    preconditions:
      - sh: command -v lynis >/dev/null 2>&1
        msg: Lynis is not installed or is not available on PATH.
    cmds:
      - lynis --version
    silent: true

