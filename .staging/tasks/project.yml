---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  TASK_SYSTEM_VERSION: "1.0.0"

tasks:
  default:
    desc: List the repository's available tasks
    cmds:
      - task --list
    silent: true

  version:
    desc: Print the repository Task system version
    cmds:
      - printf "%s\n" "{{.TASK_SYSTEM_VERSION}}"
    silent: true

  doctor:
    desc: Verify the core repository and Flutter development toolchain
    preconditions:
      - sh: command -v git >/dev/null 2>&1
        msg: Git is not installed or is not available on PATH.
      - sh: command -v task >/dev/null 2>&1
        msg: Task is not installed or is not available on PATH.
      - sh: command -v fvm >/dev/null 2>&1
        msg: FVM is not installed or is not available on PATH.
      - sh: command -v java >/dev/null 2>&1
        msg: Java is not installed or is not available on PATH.
    cmds:
      - task --version
      - git --version
      - fvm --version
      - fvm flutter --version
      - fvm dart --version
      - java --version

  platform:
    desc: Print the host platform detected by Task
    cmds:
      - >-
        printf "Operating system: %s\n" "{{OS}}"
      - >-
        printf "Architecture:     %s\n" "{{ARCH}}"
      - >-
        printf "CPU cores:        %s\n" "{{numCPU}}"
    silent: true

