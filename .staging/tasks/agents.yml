---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  AGENT_DOCTOR_SCRIPT: '{{.AGENT_DOCTOR_SCRIPT | default (joinPath .ROOT_DIR ".agents/scripts/doctor.sh")}}'
  MINDCAP_DIR: '{{.MINDCAP_DIR | default (joinPath .ROOT_DIR "tools/mindcap")}}'

tasks:
  doctor:
    desc: Check OpenCode, Ollama, configured models, and repository layout
    preconditions:
      - sh: command -v bash >/dev/null 2>&1
        msg: Bash is required to run the agent doctor.
      - sh: test -f "{{.AGENT_DOCTOR_SCRIPT}}"
        msg: 'Agent doctor script not found: {{.AGENT_DOCTOR_SCRIPT}}'
    cmds:
      - bash "{{.AGENT_DOCTOR_SCRIPT}}"

  models:list:
    desc: List locally installed Ollama models
    aliases: [models]
    preconditions:
      - sh: command -v ollama >/dev/null 2>&1
        msg: Ollama is not installed or is not available on PATH.
    cmds:
      - ollama list

  models:running:
    desc: Show models currently loaded by Ollama
    aliases: [running-models]
    preconditions:
      - sh: command -v ollama >/dev/null 2>&1
        msg: Ollama is not installed or is not available on PATH.
    cmds:
      - ollama ps

  open:
    desc: Start OpenCode with the project-local configuration
    interactive: true
    preconditions:
      - sh: command -v opencode >/dev/null 2>&1
        msg: OpenCode is not installed or is not available on PATH.
      - sh: command -v ollama >/dev/null 2>&1
        msg: Ollama is not installed or is not available on PATH.
      - sh: ollama list >/dev/null 2>&1
        msg: Ollama is not responding. Start Ollama before opening OpenCode.
    cmds:
      - opencode

  config:
    desc: Print OpenCode's resolved project configuration
    preconditions:
      - sh: command -v opencode >/dev/null 2>&1
        msg: OpenCode is not installed or is not available on PATH.
    cmds:
      - opencode debug config

  mindcap:doctor:
    desc: Run Mindcap's ChatGPT capture diagnostics
    aliases: [mindcap-doctor]
    dir: "{{.MINDCAP_DIR}}"
    preconditions:
      - sh: test -f "{{.MINDCAP_DIR}}/Taskfile.yml"
        msg: 'Mindcap Taskfile not found: {{.MINDCAP_DIR}}/Taskfile.yml'
    cmds:
      - task doctor

  mindcap:paths:
    desc: Show Mindcap artifact and browser-profile locations
    aliases: [mindcap-paths]
    dir: "{{.MINDCAP_DIR}}"
    preconditions:
      - sh: test -f "{{.MINDCAP_DIR}}/Taskfile.yml"
        msg: 'Mindcap Taskfile not found: {{.MINDCAP_DIR}}/Taskfile.yml'
    cmds:
      - task paths

