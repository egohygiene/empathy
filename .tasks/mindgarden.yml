---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  garden:standalone:install:
    desc: Install the immutable standalone Mindgarden candidate in a separate environment
    cmds:
      - python3 -m venv .cache/mindgarden-standalone
      - .cache/mindgarden-standalone/bin/python -m pip install --requirement requirements/mindgarden-standalone.txt

  garden:standalone:verify:
    desc: Verify the pinned external engine against the existing canonical Empathy garden
    preconditions:
      - sh: test -x .cache/mindgarden-standalone/bin/mindgarden
        msg: Run garden:standalone:install before the offline consumer verification
    cmds:
      - >-
        .cache/mindgarden-standalone/bin/python -I -c
        "import importlib.metadata, json, pathlib, sys, mindgarden;
        pin = pathlib.Path('requirements/mindgarden-standalone.txt').read_text().strip().rsplit('@', 1)[1];
        actual = json.loads(importlib.metadata.distribution('mindgarden').read_text('direct_url.json'));
        assert actual['vcs_info']['commit_id'] == pin;
        assert pathlib.Path(mindgarden.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve())"
      - .cache/mindgarden-standalone/bin/mindgarden --version
      - .cache/mindgarden-standalone/bin/mindgarden validate --repository-root .
      - .cache/mindgarden-standalone/bin/mindgarden search --repository-root . --query "garden"
      - .cache/mindgarden-standalone/bin/mindgarden context --repository-root . --pack empathy-agent-default --format json
      - .cache/mindgarden-standalone/bin/mindgarden publish project --repository-root . --profile mindgarden/profiles/quartz/profile.yaml --output-directory .cache/mindgarden-standalone-projection
      - .cache/mindgarden-standalone/bin/mindgarden publish verify --repository-root . --profile mindgarden/profiles/quartz/profile.yaml
      - .cache/mindgarden-standalone/bin/mindgarden verify --repository-root .

  garden:check:
    desc: Validate the incubated Mindgarden contract and Empathy garden
    cmds:
      - >-
        python3 -m unittest discover
        --start-directory mindgarden/tests
        --pattern "test_*.py"
        --verbose
      - >-
        python3 -m unittest discover
        --start-directory tests
        --pattern "test_mindgarden_obsidian_integration.py"
        --verbose
      - >-
        python3 -m unittest discover
        --start-directory tests
        --pattern "test_mindgarden_publishing_integration.py"
        --verbose
      - >-
        python3 mindgarden/scripts/validate_garden.py
        --repository-root .
      - >-
        python3 mindgarden/scripts/garden_agent.py
        --repository-root .
        verify
      - >-
        python3 mindgarden/scripts/publish_garden.py
        --repository-root .
        verify

  garden:index:
    desc: Materialize the disposable deterministic Mindgarden catalog
    cmds:
      - >-
        python3 mindgarden/scripts/garden_agent.py
        --repository-root .
        index
        --write

  garden:context:
    desc: Render Empathy's default reviewed context pack
    cmds:
      - >-
        python3 mindgarden/scripts/garden_agent.py
        --repository-root .
        context
        --pack "empathy-agent-default"
        --format "markdown"

  garden:llms:write:
    desc: Regenerate the committed llms.txt agent entrypoint
    cmds:
      - >-
        python3 mindgarden/scripts/garden_agent.py
        --repository-root .
        llms
        --write

  garden:publish:check:
    desc: Verify the deterministic reviewed-public projection
    cmds:
      - >-
        python3 mindgarden/scripts/publish_garden.py
        --repository-root .
        verify

  garden:publish:
    desc: Materialize the disposable reviewed-public projection
    cmds:
      - >-
        python3 mindgarden/scripts/publish_garden.py
        --repository-root .
        project
        --output-directory ".cache/mindgarden/publish"

  garden:site:build:
    desc: Build the public garden with the pinned Quartz engine
    cmds:
      - >-
        python3 mindgarden/scripts/quartz_site.py
        --repository-root .
        build

  garden:site:serve:
    desc: Serve the public garden locally with the pinned Quartz engine
    cmds:
      - >-
        python3 mindgarden/scripts/quartz_site.py
        --repository-root .
        serve
        --port "{{.SITE_PORT | default 8080}}"
