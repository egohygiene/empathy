---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  identity:pin:check:
    desc: Verify Empathy consumes the reviewed immutable Identity revision
    internal: true
    preconditions:
      - sh: test -f "identity/Cargo.toml"
        msg: >-
          Identity is not initialized. Run:
          git submodule update --init --recursive "identity"
    cmds:
      - |
        set -euo pipefail
        expected_revision="$(python3 - <<'PY'
        import json
        from pathlib import Path

        lock = json.loads(Path(".config/identity/consumer-lock.json").read_text(encoding="utf-8"))
        print(lock["revision"])
        PY
        )"
        tree_revision="$(git ls-tree "HEAD" "identity" | awk '{print $3}')"
        worktree_revision="$(git -C "identity" rev-parse "HEAD")"
        test "${tree_revision}" = "${expected_revision}"
        test "${worktree_revision}" = "${expected_revision}"
        test -z "$(git -C "identity" status --short)"

  identity:check:
    desc: Validate the pinned Identity CLI and Empathy identity contract
    deps:
      - identity:pin:check
    cmds:
      - cargo fmt --manifest-path "identity/Cargo.toml" --all --check
      - >-
        cargo clippy
        --manifest-path "identity/Cargo.toml"
        --all-targets
        --all-features
        --
        -D warnings
      - cargo test --manifest-path "identity/Cargo.toml" --all-features
      - >-
        cargo run
        --quiet
        --manifest-path "identity/Cargo.toml"
        --
        validate
        --repository-root "."

  identity:plan:
    desc: Render Empathy's resolved identity target plan with the pinned CLI
    deps:
      - identity:pin:check
    cmds:
      - >-
        cargo run
        --quiet
        --manifest-path "identity/Cargo.toml"
        --
        plan
        --repository-root "."
        --format "markdown"

  identity:handoff:
    desc: Build Empathy's contextual creative handoff with the pinned CLI
    deps:
      - identity:pin:check
    cmds:
      - >-
        cargo run
        --quiet
        --manifest-path "identity/Cargo.toml"
        --
        handoff
        --repository-root "."
        --output-directory ".cache/identity/handoff"
