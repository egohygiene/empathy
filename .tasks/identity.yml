---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  identity:pin:check:
    desc: Verify Empathy consumes the reviewed immutable Identity revision.
    internal: true
    preconditions:
      - sh: test -f "identity/Cargo.toml"
        msg: >-
          Identity is not initialized. Run:
          git submodule update --init --recursive "identity"
    cmds:
      - |
        set -euo pipefail
        expected_revision="$(python3 - <<'PY'
        import json
        from pathlib import Path

        lock = json.loads(Path(".config/identity/consumer-lock.json").read_text(encoding="utf-8"))
        print(lock["revision"])
        PY
        )"
        tree_revision="$(git ls-tree "HEAD" "identity" | awk '{print $3}')"
        worktree_revision="$(git -C "identity" rev-parse "HEAD")"
        test "${tree_revision}" = "${expected_revision}"
        test "${worktree_revision}" = "${expected_revision}"
        test -z "$(git -C "identity" status --short)"

  identity:v1:check:
    desc: Validate Empathy's pinned Identity v1 source contract.
    deps: [identity:pin:check]
    cmds:
      - python3 identity/scripts/validate_identity.py --repository-root . --format json

  identity:v1:generate:
    desc: Generate Empathy's complete Identity v1 package from reviewed source.
    deps: [identity:v1:check]
    cmds:
      - cargo run --quiet --manifest-path identity/Cargo.toml -- v1-generate --repository-root .

  identity:v1:verify:
    desc: Verify Empathy's complete Identity v1 package has no missing or drifted files.
    deps: [identity:v1:check]
    cmds:
      - cargo run --quiet --manifest-path identity/Cargo.toml -- v1-verify --repository-root .

  identity:check:
    desc: Validate Empathy's immutable Identity v1 consumer contract.
    deps: [identity:v1:check]
