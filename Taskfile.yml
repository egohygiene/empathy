---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

includes:
  egolint:
    taskfile: ./egolint/tasks/lint.yml
    dir: .
  mantle:
    taskfile: ./mantle/Taskfile.yml
    dir: ./mantle
  tool:
    taskfile: ./egolint/tasks/complementary.yml
    dir: .

vars:
  NPM_CACHE: .cache/npm
  PRETTIER_CONFIG: egolint/.config/lint/javascript/prettier.config.mjs
  PRETTIER_VERSION: 3.9.6

tasks:
  default:
    desc: List the repository task contract
    cmds:
      - task --list
    silent: true

  check:
    desc: Run the complete repository validation contract
    deps:
      - architecture:check
      - format:check
      - garden:check
      - lint
      - mantle:check
      - test
    cmds:
      - git diff --check

  format:
    desc: Format supported text files
    cmds:
      - >-
        npx --yes --cache "{{.NPM_CACHE}}"
        "prettier@{{.PRETTIER_VERSION}}"
        --config "{{.PRETTIER_CONFIG}}" --write .

  format:check:
    desc: Verify supported text formatting
    cmds:
      - >-
        npx --yes --cache "{{.NPM_CACHE}}"
        "prettier@{{.PRETTIER_VERSION}}"
        --config "{{.PRETTIER_CONFIG}}" --check .

  garden:check:
    desc: Validate the incubated Mindgarden contract and Empathy garden
    cmds:
      - >-
        python3 -m unittest discover
        --start-directory mindgarden/tests
        --pattern "test_*.py"
        --verbose
      - >-
        python3 -m unittest discover
        --start-directory tests
        --pattern "test_mindgarden_obsidian_integration.py"
        --verbose
      - >-
        python3 mindgarden/scripts/validate_garden.py
        --repository-root .
      - >-
        python3 mindgarden/scripts/garden_agent.py
        --repository-root .
        verify

  garden:index:
    desc: Materialize the disposable deterministic Mindgarden catalog
    cmds:
      - >-
        python3 mindgarden/scripts/garden_agent.py
        --repository-root .
        index
        --write

  garden:context:
    desc: Render Empathy's default reviewed context pack
    cmds:
      - >-
        python3 mindgarden/scripts/garden_agent.py
        --repository-root .
        context
        --pack "empathy-agent-default"
        --format "markdown"

  garden:llms:write:
    desc: Regenerate the committed llms.txt agent entrypoint
    cmds:
      - >-
        python3 mindgarden/scripts/garden_agent.py
        --repository-root .
        llms
        --write

  hooks:install:
    desc: Install Husky as the repository's sole Git hook manager
    cmds:
      - task: egolint:hooks:install

  hooks:check:
    desc: Verify Git hook ownership and executability
    cmds:
      - task: egolint:hooks:check

  precommit:staged:
    desc: Run the automatic structural and security profile
    cmds:
      - task: egolint:precommit:staged

  precommit:all:
    desc: Run the complete manual pre-commit profile
    cmds:
      - task: egolint:precommit:all

  commit:create:
    desc: Create an emoji Conventional Commit with Commitizen
    cmds:
      - task: egolint:commit:create

  commit:validate:
    desc: Validate a commit-message file passed after --
    cmds:
      - task: egolint:commit:validate
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"

  commit:test:
    desc: Validate canonical commit-message fixtures
    cmds:
      - task: egolint:commit:test

  secrets:check:
    desc: Validate the reviewed scanner baseline
    cmds:
      - task: egolint:secrets:check

  license:check:
    desc: Validate MIT/SPDX headers and REUSE compliance
    cmds:
      - task: egolint:license:check

  lint:
    desc: Lint the complete repository through the canonical holistic policy
    cmds:
      - task: egolint:holistic

  lint:fast:
    desc: Lint changed repository files through the deterministic fast policy
    cmds:
      - task: egolint:fast

  lint:all:
    desc: Lint the complete repository through the universal Egolint profile
    cmds:
      - task: egolint:all

  lint:holistic:
    desc: Run every supported Egolint descriptor against the repository
    cmds:
      - task: egolint:holistic

  lint:contracts:
    desc: Validate MegaLinter and complementary toolchain contracts
    cmds:
      - task: architecture:check
      - task: egolint:contracts
      - task: tool:contracts
      - task: lint:architecture

  architecture:check:
    desc: Validate the architecture document inventory and dependency graph
    cmds:
      - >-
        python3 -m unittest
        tests.test_architecture_documents
        --verbose

  lint:architecture:
    desc: Verify the generated lint architecture matches the tool matrices
    cmds:
      - >-
        python3
        .github/actions/generate-lint-infographic/generate_lint_infographic.py
        --repository-root .
        --output-directory .reports/egolint/architecture
        --check

  lint:architecture:write:
    desc: Regenerate the lint architecture SVG and Markdown legend
    cmds:
      - >-
        python3
        .github/actions/generate-lint-infographic/generate_lint_infographic.py
        --repository-root .
        --output-directory .reports/egolint/architecture
        --write

  lint:complementary:
    desc: Run every applicable non-MegaLinter tool
    cmds:
      - task: tool:all

  security:source:
    desc: Run complementary and MegaLinter-native source security checks
    cmds:
      - task: tool:detect-secrets
      - task: egolint:betterleaks
      - task: egolint:secretlint

  security:dependencies:
    desc: Scan discovered dependencies and repository packages for vulnerabilities
    cmds:
      - task: egolint:grype
      - task: egolint:trivy

  sbom:generate:
    desc: Generate SPDX and CycloneDX dependency inventories
    cmds:
      - task: egolint:syft
      - task: egolint:trivy-sbom

  sbom:scan:
    desc: Scan dependency inventories and repository packages for vulnerabilities
    cmds:
      - task: security:dependencies

  tools:status:
    desc: Show complementary applicability and dependency state
    cmds:
      - task: tool:status

  tools:versions:
    desc: Print the pinned complementary tool inventory
    cmds:
      - task: tool:versions

  tools:install:
    desc: Install the locked complementary Python lint environment
    cmds:
      - task: tool:dependencies:python

  tools:install:security:
    desc: Install the separately locked Python security dependency group
    cmds:
      - task: tool:dependencies:security

  lint:doctor:
    desc: Diagnose the local Egolint and MegaLinter runtime
    cmds:
      - task: egolint:doctor

  lint:fix:
    desc: Apply supported Egolint fixes for explicit review
    cmds:
      - task: egolint:fix

  test:
    desc: Run root and Egolint unit tests
    cmds:
      - >-
        python3 -m unittest discover
        --start-directory tests
        --pattern "test_*.py"
        --verbose
      - >-
        python3 -m unittest discover
        --start-directory egolint/tests
        --pattern "test_*.py"
        --verbose
