---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

# Keep this file as the repository's composition root. Universal commands live
# in focused `.tasks/` modules; subsystem Taskfiles retain their own ownership.
includes:
  project:
    taskfile: ./.tasks/project.yml
    flatten: true
  quality:
    taskfile: ./.tasks/quality.yml
    flatten: true
  mindgarden:
    taskfile: ./.tasks/mindgarden.yml
    flatten: true
  identity:
    taskfile: ./.tasks/identity.yml
    flatten: true
  git:
    taskfile: ./.tasks/git.yml
    dir: .
  beacon:
    taskfile: ./beacon/Taskfile.yml
    dir: ./beacon
  egolint:
    taskfile: ./egolint/tasks/lint.yml
    dir: .
  mantle:
    taskfile: ./mantle/Taskfile.yml
    dir: ./mantle
  react-vite:
    taskfile: ./holon/packs/react-vite/template/Taskfile.yml
    dir: ./holon/packs/react-vite/template
  tool:
    taskfile: ./egolint/tasks/complementary.yml
    dir: .
