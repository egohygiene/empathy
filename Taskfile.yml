---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  NPM_CACHE: .cache/npm
  PRETTIER_VERSION: 3.9.6
  MARKDOWNLINT_VERSION: 0.23.2

tasks:
  default:
    desc: List the repository task contract
    cmds:
      - task --list
    silent: true

  check:
    desc: Run the complete repository validation contract
    deps:
      - format:check
      - lint
      - test
    cmds:
      - git diff --check

  format:
    desc: Format supported text files
    cmds:
      - >-
        npx --yes --cache "{{.NPM_CACHE}}"
        "prettier@{{.PRETTIER_VERSION}}" --write .

  format:check:
    desc: Verify supported text formatting
    cmds:
      - >-
        npx --yes --cache "{{.NPM_CACHE}}"
        "prettier@{{.PRETTIER_VERSION}}" --check .

  lint:
    desc: Validate Markdown, Python syntax, and GitHub automation policy
    cmds:
      - >-
        npx --yes --cache "{{.NPM_CACHE}}"
        "markdownlint-cli2@{{.MARKDOWNLINT_VERSION}}"
        "**/*.md" "#**/.staging/**" "#.github/copilot-instructions.md"
      - python3 -m compileall -q .github/actions
      - >-
        python3 .github/actions/validate-automation/validate_automation.py
        --repository-root .

  test:
    desc: Run baseline unit tests
    cmds:
      - >-
        python3 -m unittest discover
        --start-directory tests
        --pattern "test_*.py"
        --verbose
