---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

includes:
  egolint:
    taskfile: ./egolint/tasks/lint.yml
    dir: .

vars:
  NPM_CACHE: .cache/npm
  PRETTIER_CONFIG: egolint/.config/lint/javascript/prettier.config.mjs
  PRETTIER_VERSION: 3.9.6

tasks:
  default:
    desc: List the repository task contract
    cmds:
      - task --list
    silent: true

  check:
    desc: Run the complete repository validation contract
    deps:
      - format:check
      - lint
      - test
    cmds:
      - git diff --check

  format:
    desc: Format supported text files
    cmds:
      - >-
        npx --yes --cache "{{.NPM_CACHE}}"
        "prettier@{{.PRETTIER_VERSION}}"
        --config "{{.PRETTIER_CONFIG}}" --write .

  format:check:
    desc: Verify supported text formatting
    cmds:
      - >-
        npx --yes --cache "{{.NPM_CACHE}}"
        "prettier@{{.PRETTIER_VERSION}}"
        --config "{{.PRETTIER_CONFIG}}" --check .

  lint:
    desc: Lint changed repository files through the canonical Egolint toolchain
    cmds:
      - task: egolint:changed

  lint:all:
    desc: Lint the complete repository through the universal Egolint profile
    cmds:
      - task: egolint:all

  lint:holistic:
    desc: Run every supported Egolint descriptor against the repository
    cmds:
      - task: egolint:holistic

  lint:doctor:
    desc: Diagnose the local Egolint and MegaLinter runtime
    cmds:
      - task: egolint:doctor

  lint:fix:
    desc: Apply supported Egolint fixes for explicit review
    cmds:
      - task: egolint:fix

  test:
    desc: Run root and Egolint unit tests
    cmds:
      - >-
        python3 -m unittest discover
        --start-directory tests
        --pattern "test_*.py"
        --verbose
      - >-
        python3 -m unittest discover
        --start-directory egolint/tests
        --pattern "test_*.py"
        --verbose
