---
# Canonical Egolint pre-commit profile.
#
# Run from the monorepo root with:
#   pre-commit run --config egolint/.pre-commit-config.yaml --all-files

minimum_pre_commit_version: "4.6.0"
fail_fast: false

exclude: |-
  (?x)^(
    \.git/.*
    |\.cache/.*
    |\.reports/.*
    |\.staging/.*
    |.*\.lock$
    |.*node_modules/.*
    |.*(?:\.venv|venv)/.*
    |.*(?:build|coverage|dist|target)/.*
  )$

default_install_hook_types:
  - pre-commit
  - commit-msg

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: "security · detect committed secrets"
        args:
          - --config=egolint/.config/security/gitleaks/.gitleaks.toml

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: "filesystem · block unexpectedly large files"
        args:
          - --maxkb=5000
      - id: check-case-conflict
        name: "filesystem · detect case conflicts"
      - id: check-executables-have-shebangs
        name: "filesystem · require executable shebangs"
      - id: check-illegal-windows-names
        name: "filesystem · reject illegal Windows names"
      - id: check-json
        name: "configuration · validate JSON"
        exclude: >-
          (^|/)(\.devcontainer|\.vscode)/.*\.json$
      - id: check-merge-conflict
        name: "git · detect merge markers"
      - id: check-shebang-scripts-are-executable
        name: "filesystem · require executable script modes"
      - id: check-symlinks
        name: "filesystem · validate symlinks"
      - id: check-toml
        name: "configuration · validate TOML"
      - id: check-yaml
        name: "configuration · validate YAML"
        args:
          - --allow-multiple-documents
      - id: destroyed-symlinks
        name: "filesystem · detect destroyed symlinks"
      - id: end-of-file-fixer
        name: "filesystem · require final newlines"
      - id: forbid-new-submodules
        name: "git · reject new submodules"
      - id: mixed-line-ending
        name: "filesystem · normalize line endings"
        args:
          - --fix=lf
      - id: no-commit-to-branch
        name: "git · protect default branches"
        args:
          - --branch=main
          - --branch=master
      - id: trailing-whitespace
        name: "filesystem · trim trailing whitespace"
        args:
          - --markdown-linebreak-ext=md

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        name: "python · lint and apply safe fixes"
        args:
          - --config=egolint/.config/lint/python/ruff.toml
          - --fix
      - id: ruff-format
        name: "python · format"
        args:
          - --config=egolint/.config/lint/python/ruff.toml

  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-ruff
        name: "notebook · lint with Ruff"
        args:
          - --config=egolint/.config/lint/python/ruff.toml
          - --fix
      - id: nbqa-ruff-format
        name: "notebook · format with Ruff"
        args:
          - --config=egolint/.config/lint/python/ruff.toml

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        name: "python · validate pyproject metadata"
        additional_dependencies:
          - validate-pyproject-schema-store[all]

  - repo: https://github.com/biomejs/pre-commit
    rev: v0.6.1
    hooks:
      - id: biome-check
        name: "web · lint and format with Biome"
        additional_dependencies:
          - "@biomejs/biome@2.5.5"

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        name: "markdown · validate style"
        args:
          - --config=egolint/.config/lint/markdown/.markdownlint.json

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        name: "markdown · format"

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: "shell · analyze scripts"
        args:
          - --rcfile=egolint/.config/lint/shell/shellcheckrc

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: "dockerfile · analyze images"
        args:
          - --config=egolint/.config/lint/dockerfile/hadolint.yaml

  - repo: https://github.com/openstack/bashate
    rev: 2.1.1
    hooks:
      - id: bashate
        name: "shell · validate style compatibility"
        args:
          - --ignore=E006

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.3
    hooks:
      - id: check-github-actions
        name: "github · validate action metadata schemas"
      - id: check-github-workflows
        name: "github · validate workflow schemas"
      - id: check-taskfile
        name: "task · validate Taskfile schemas"

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        name: "prose · detect misspellings"
        args:
          - --config=egolint/.config/lint/prose/spell/.codespellrc
        additional_dependencies:
          - tomli

  - repo: https://github.com/crate-ci/typos
    rev: v1.32.0
    hooks:
      - id: typos
        name: "prose · detect identifier typos"
        args:
          - --config=egolint/.typos.toml

  - repo: local
    hooks:
      - id: commitlint
        name: "git · validate commit message"
        entry: >-
          pnpm --dir egolint exec commitlint
          --config egolint/.config/lint/commits/commitlint.config.mjs
          --edit
        language: system
        stages:
          - commit-msg

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        name: "license · validate REUSE metadata"

ci:
  autofix_commit_msg: |-
    chore(lint): apply pre-commit fixes

    [skip ci]
  autofix_prs: true
  autoupdate_commit_msg: "chore(deps): update pre-commit hooks"
  autoupdate_schedule: monthly
  skip:
    - commitlint
  submodules: false
